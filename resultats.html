<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#061827"><title>Mareuil Match — Résultats</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#fff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#031827 url("/assets/mareuil-bg-high.jpg?v=20260918-2") center/cover fixed no-repeat;min-height:100vh}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(1,13,27,.15),rgba(1,10,19,.78));pointer-events:none}
main{position:relative;z-index:1;max-width:760px;margin:auto;padding:12px 9px 30px}.card{background:linear-gradient(145deg,rgba(5,29,48,.84),rgba(2,17,31,.74));border:1px solid rgba(102,190,235,.4);border-radius:24px;padding:15px;margin:10px 0;box-shadow:0 18px 45px #0007;backdrop-filter:blur(9px)}
.hero{text-align:center;padding:18px 12px}.hero .ball{font-size:44px}.hero h1{margin:3px 0;font-size:28px}.hero h1 span{color:#35df79}.hero h2{margin:8px 0 2px;font-size:22px}.date{margin:0;color:#b7cbd4;font-size:12px}.live{display:inline-flex;align-items:center;gap:7px;margin-top:11px;padding:7px 12px;border-radius:999px;background:rgba(43,209,91,.12);border:1px solid #2bd15b55;color:#72ec8c;font-size:11px;font-weight:950}.dot{width:7px;height:7px;border-radius:50%;background:#48e96c;box-shadow:0 0 10px #48e96c}.votes{text-align:center}.votes b{font-size:27px}.votes span{color:#a9c1cc;font-size:12px}.section h3{margin:0 0 11px;font-size:18px}.section.top{border-color:#179fdf66}.section.flop{border-color:#ef465066}.section h3.top-title{color:#50d3ff}.section h3.flop-title{color:#ff737a}.row{display:flex;align-items:center;gap:9px;padding:9px 7px;border-top:1px solid rgba(255,255,255,.08)}.row:first-of-type{border-top:0}.rank{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#eaf8ff;color:#0a719f;font-weight:950;font-size:12px}.flop .rank{color:#c22e38}.name{flex:1;font-weight:850;min-width:0}.name b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.detail{display:block;color:#91afbc;font-size:10px;margin-top:2px}.pts{font-weight:950;font-size:16px;min-width:45px;text-align:right}.top .pts{color:#5be0ff}.flop .pts{color:#ff737a}.overall h3{margin:0 0 10px;font-size:18px}.overall-row{display:flex;align-items:center;gap:10px;padding:10px 7px;border-top:1px solid rgba(255,255,255,.08)}.overall-row:first-of-type{border-top:0}.overall-rank{width:27px;color:#b8cbd3;font-weight:950;text-align:center}.overall-name{flex:1;font-weight:850}.overall-points{font-size:18px;font-weight:950}.positive{color:#67e77f}.negative{color:#ff747b}.zero{color:#b7cbd4}.updated{text-align:center;color:#819ba7;font-size:10px;margin:12px 0}.nav{position:sticky;bottom:8px;z-index:10;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:6px;background:rgba(3,19,31,.94);border:1px solid #2c6278;border-radius:18px;backdrop-filter:blur(10px)}.nav a{color:#9bb9c7;text-decoration:none;text-align:center;font-size:9px;font-weight:850;padding:7px 3px;border-radius:12px}.nav a.active{color:#65e979;background:rgba(48,190,88,.12)}.nav i{display:block;font-style:normal;font-size:18px;margin-bottom:2px}.err{text-align:center;color:#ff858b;font-weight:900;padding:30px 10px}
@media(max-width:520px){main{padding:7px 6px 25px}.card{border-radius:20px;padding:12px}.hero h1{font-size:24px}.hero h2{font-size:19px}.votes b{font-size:24px}}
</style>
</head>
<body>
<main>
<div id="app"><div class="card hero"><div class="ball">⚽</div><h1>MAREUIL <span>MATCH</span></h1><p>Chargement des résultats…</p></div></div>
</main>
<script>
(function(){
  const app=document.getElementById('app');
  const token=new URLSearchParams(location.search).get('token')||'';
  const API='/api/results';
  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function points(v){return v>0?'<span class="positive">+'+v+'</span>':v<0?'<span class="negative">'+v+'</span>':'<span class="zero">0</span>'}
  function playerRow(p,i,flop){
    const votes=(flop?p.flop_votes:p.top_votes);
    const total=votes.reduce((a,b)=>a+b,0);
    const pts=flop?p.flop_points:p.top_points;
    return '<div class="row"><span class="rank">'+(i+1)+'</span><span class="name"><b>'+esc(p.name)+'</b><small class="detail">'+total+' sélection'+(total>1?'s':'')+' · '+votes.map((v,j)=>v?' '+(j+1)+'er: '+v:'').filter(Boolean).join(' · ')+'</small></span><span class="pts">'+(pts>0?'+':'')+pts+'</span></div>';
  }
  function render(d){
    const date=new Date(d.match.match_date+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    const top=[...d.results].filter(p=>p.top_points!==0||p.top_votes.some(Boolean)).sort((a,b)=>b.top_points-a.top_points||b.top_votes.reduce((x,y)=>x+y,0)-a.top_votes.reduce((x,y)=>x+y,0));
    const flop=[...d.results].filter(p=>p.flop_points!==0||p.flop_votes.some(Boolean)).sort((a,b)=>a.flop_points-b.flop_points||b.flop_votes.reduce((x,y)=>x+y,0)-a.flop_votes.reduce((x,y)=>x+y,0));
    const overall=[...d.results].sort((a,b)=>b.total-a.total||b.top_points-a.top_points);
    app.innerHTML='<div class="card hero"><div class="ball">⚽</div><h1>MAREUIL <span>MATCH</span></h1><h2>'+esc(d.match.opponent)+'</h2><p class="date">'+date+'</p><div class="live"><span class="dot"></span> RÉSULTATS EN DIRECT</div></div>'+
      '<div class="card votes"><b>'+d.voted_count+' / '+d.voters_count+'</b><br><span>votants ont participé</span></div>'+
      '<section class="card section top"><h3 class="top-title">🌊 MAREUILLAIS SUR LE LAY</h3>'+(top.length?top.map((p,i)=>playerRow(p,i,false)).join(''):'<div class="row">Aucun vote pour le moment.</div>')+'</section>'+
      '<section class="card section flop"><h3 class="flop-title">🌧️ MAREUILLAIS SOUS LE LAY</h3>'+(flop.length?flop.map((p,i)=>playerRow(p,i,true)).join(''):'<div class="row">Aucun vote pour le moment.</div>')+'</section>'+
      '<section class="card overall"><h3>🏆 Points de ce match</h3>'+overall.map((p,i)=>'<div class="overall-row"><span class="overall-rank">'+(i+1)+'</span><span class="overall-name">'+esc(p.name)+'</span><span class="overall-points">'+points(p.total)+'</span></div>').join('')+'</section>'+
      '<div id="updated" class="updated"></div>'+
      '<nav class="nav"><a href="/vote.html?token='+encodeURIComponent(token)+'">⚽<i>Vote</i></a><a href="/">⌂<i>Accueil</i></a><a class="active" href="/resultats.html?token='+encodeURIComponent(token)+'">📊<i>Résultats</i></a></nav>';
    document.getElementById('updated').textContent='Mise à jour automatique · '+new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  }
  async function load(){
    if(!token){app.innerHTML='<div class="card err">Lien de résultats incomplet.</div>';return}
    try{
      const r=await fetch(API+'?token='+encodeURIComponent(token),{cache:'no-store'});
      const text=await r.text();let d;try{d=JSON.parse(text)}catch{throw Error('Réponse invalide du serveur.')}
      if(!r.ok)throw Error(d.error||'Impossible de charger les résultats.');
      render(d);
    }catch(e){app.innerHTML='<div class="card err">'+esc(e.message)+'</div>'}
  }
  load();
  setInterval(load,3000);
})();
</script>
</body></html>
