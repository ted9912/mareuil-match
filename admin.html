<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administration — Mareuil Match</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#06110a;color:#fff;font-family:Arial,sans-serif}main{max-width:760px;margin:auto;padding:18px}
h1,h2{color:#61df4c}.card{background:#102017;border:1px solid #29432f;border-radius:20px;padding:18px;margin:12px 0}
input,select,button{width:100%;padding:13px;margin:6px 0;border-radius:11px;font-size:16px}button{border:0;background:#61df4c;font-weight:800}.secondary{background:#26362b;color:#fff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{border-top:1px solid #29432f;padding:12px 0}.muted{color:#aeb8b0}.err{color:#ff7777;font-weight:700}.hide{display:none}.rank{display:flex;justify-content:space-between}
</style></head><body><main>
<h1>⚽ Mareuil Match — Administration</h1>
<div id="login" class="card"><h2>Connexion</h2><input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Mot de passe"><button onclick="login()">Se connecter</button><button class="secondary" onclick="signup()">Créer mon compte administrateur</button><p id="lm"></p></div>
<div id="dash" class="hide">
<div class="card"><button class="secondary" onclick="logout()">Se déconnecter</button><h2>Nouvelle saison</h2><input id="sname" placeholder="Ex. Saison 2026-2027"><div class="row"><input id="sstart" type="date"><input id="senddate" type="date"></div><button onclick="createSeason()">Créer la saison</button></div>
<div class="card"><h2>Nouveau joueur</h2><input id="pname" placeholder="Nom du joueur"><button onclick="createPlayer()">Ajouter</button></div>
<div class="card"><h2>Nouveau votant</h2><input id="vname" placeholder="Nom du votant"><select id="vtype"><option value="director">Dirigeant</option><option value="player">Joueur</option></select><button onclick="createVoter()">Ajouter</button></div>
<div class="card"><h2>Nouveau match</h2><select id="season"></select><input id="opponent" placeholder="Adversaire"><input id="mdate" type="date"><button onclick="createMatch()">Créer le match</button><p id="link"></p></div>
<div class="card"><h2>Matchs</h2><div id="matches"></div></div>
<div class="card"><h2>Classement de la saison</h2><select id="rseason" onchange="loadRanking()"></select><div id="ranking"></div></div>
</div>
<script>
const SB_URL='https://hikwcryqqixqjmckhxyh.supabase.co';
const SB_KEY='sb_publishable_LkQYS2DPXHlsgM0brO_84g_Z4KEdWwy';
const API=SB_URL+'/functions/v1/mareuil-admin-api';
const sb=supabase.createClient(SB_URL,SB_KEY);
async function authFetch(path,opt={}){let {data}=await sb.auth.getSession();if(!data.session)throw Error('Session expirée');opt.headers={...(opt.headers||{}),Authorization:'Bearer '+data.session.access_token,'Content-Type':'application/json'};let r=await fetch(API+path,opt);let j=await r.json();if(!r.ok)throw Error(j.error||'Erreur');return j}
async function login(){try{let {error}=await sb.auth.signInWithPassword({email:email.value,password:pass.value});if(error)throw error;show()}catch(e){lm.textContent=e.message;lm.className='err'}}
async function signup(){try{let {error}=await sb.auth.signUp({email:email.value,password:pass.value});if(error)throw error;lm.textContent='Compte créé. Vérifie ton email si demandé.'}catch(e){lm.textContent=e.message;lm.className='err'}}
async function logout(){await sb.auth.signOut();location.reload()}
function show(){login.classList.add('hide');dash.classList.remove('hide');refresh()}
async function refresh(){try{let d=await authFetch('');season.innerHTML=d.seasons.map(s=>'<option value="'+s.id+'">'+s.name+'</option>').join('');rseason.innerHTML=season.innerHTML;matches.innerHTML=d.matches.map(m=>'<div class="item"><b>'+m.match_date+' — '+m.opponent+'</b><br><span class="muted">'+m.status+'</span> · <a href="/vote.html?token='+m.public_token+'">lien vote</a> '+(m.status==='open'?'<button onclick="closeMatch(\''+m.id+'\')">Fermer</button>':'')+'</div>').join('')||'<span class="muted">Aucun match.</span>'}catch(e){alert(e.message)}}
async function createSeason(){await authFetch('/season',{method:'POST',body:JSON.stringify({name:sname.value,start_date:sstart.value||null,end_date:senddate.value||null})});sname.value='';refresh()}
async function createPlayer(){await authFetch('/player',{method:'POST',body:JSON.stringify({name:pname.value})});pname.value='';refresh()}
async function createVoter(){await authFetch('/voter',{method:'POST',body:JSON.stringify({name:vname.value,voter_type:vtype.value})});vname.value='';refresh()}
async function createMatch(){let m=await authFetch('/match',{method:'POST',body:JSON.stringify({season_id:season.value,opponent:opponent.value,match_date:mdate.value})});link.innerHTML='Lien de vote : <a href="/vote.html?token='+m.public_token+'">ouvrir</a><br>'+location.origin+'/vote.html?token='+m.public_token;refresh()}
async function closeMatch(id){await authFetch('/close-match',{method:'POST',body:JSON.stringify({match_id:id})});refresh()}
async function loadRanking(){try{let a=await authFetch('/rankings?season_id='+rseason.value);ranking.innerHTML=a.map((x,i)=>'<div class="item rank"><b>'+(i+1)+'. '+x.player_name+'</b><span>'+Number(x.ranking_score).toFixed(2)+' pts</span></div>').join('')||'<span class="muted">Pas encore de classement.</span>'}catch(e){ranking.textContent=e.message}}
sb.auth.getSession().then(({data})=>{if(data.session)show()});
</script></main></body></html>
