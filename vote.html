<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vote — Mareuil Match</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#06110a;color:#fff;font-family:Arial,sans-serif}main{max-width:680px;margin:auto;padding:18px}
.card{background:#102017;border:1px solid #29432f;border-radius:20px;padding:18px;margin:12px 0}h1{color:#61df4c}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.pick{padding:13px 8px;border:2px solid #304237;border-radius:12px;background:#0b160f;color:#fff;font-weight:600}
.top .selected{border-color:#61df4c;background:#122d16}.flop .selected{border-color:#ef5350;background:#301515}
select,button{width:100%;padding:14px;border-radius:12px;font-size:16px}select{background:#fff;color:#111;border:0}.send{background:#61df4c;border:0;font-weight:800;margin-top:10px}.send:disabled{opacity:.45}
.muted{color:#aeb8b0}.err{color:#ff7777;font-weight:700}.ok{text-align:center;padding:40px 10px}
</style></head><body><main><div id="app" class="card">Chargement…</div></main>
<script>
const API='https://hikwcryqqixqjmckhxyh.supabase.co/functions/v1/mareuil-match';
const token=new URLSearchParams(location.search).get('token');let d,top=[],flop=[];
const $=x=>document.getElementById(x);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){
 if(!token){$('app').innerHTML='<h1>⚽ Mareuil Match</h1><p class="err">Lien de vote incomplet.</p>';return}
 try{let r=await fetch(API+'?api=match&token='+encodeURIComponent(token));let j=await r.json();if(!r.ok)throw Error(j.error||'Erreur');d=j;render()}
 catch(e){$('app').innerHTML='<h1>⚽ Mareuil Match</h1><p class="err">'+esc(e.message)+'</p>'}
}
function render(){
 $('app').innerHTML='<h1>⚽ Mareuil Match</h1><p class="muted">'+esc(d.match.opponent)+' · '+new Date(d.match.match_date+'T12:00:00').toLocaleDateString('fr-FR')+'</p>'+
 '<div class="card"><select id="voter"><option value="">Choisis ton nom</option>'+d.voters.map(v=>'<option value="'+v.id+'">'+esc(v.name)+'</option>').join('')+'</select></div>'+
 '<div class="card top"><h2>🟢 TOP</h2><p class="muted">Tes 4 meilleurs : +4, +3, +2, +1</p><div id="top" class="grid"></div></div>'+
 '<div class="card flop"><h2>🔴 FLOP</h2><p class="muted">Tes 4 moins bons : −4, −3, −2, −1</p><div id="flop" class="grid"></div></div>'+
 '<div class="card"><button id="send" class="send" disabled>Valider mon vote</button><p id="msg"></p></div>';
 draw();$('voter').onchange=check;$('send').onclick=submit;
}
function draw(){
 [['top',top],[ 'flop',flop]].forEach(([kind,arr])=>{
  let box=$(kind);box.innerHTML='';
  d.players.forEach(p=>{let b=document.createElement('button');b.className='pick'+(arr.includes(p.id)?' selected':'');let i=arr.indexOf(p.id);
   b.textContent=p.name+(i>=0?'  ·  '+(kind==='top'?[4,3,2,1][i]:'−'+[4,3,2,1][i]):'');
   b.onclick=()=>choose(kind,p.id);box.appendChild(b)})
 })
}
function choose(kind,id){let arr=kind==='top'?top:flop;if(arr.includes(id))arr.splice(arr.indexOf(id),1);else if(arr.length<4)arr.push(id);draw();check()}
function check(){let distinct=new Set([...top,...flop]).size;$('send').disabled=!($('voter').value&&top.length===4&&flop.length===4&&distinct===8)}
async function submit(){
 $('send').disabled=true;$('msg').textContent='Envoi…';
 let b={token,voter_id:$('voter').value};top.forEach((x,i)=>b['top_'+(i+1)]=x);flop.forEach((x,i)=>b['flop_'+(i+1)]=x);
 try{let r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});let j=await r.json();if(!r.ok)throw Error(j.error||'Erreur');$('app').innerHTML='<div class="ok"><h1>✅ Vote enregistré</h1><p>Merci pour ton vote !</p></div>'}
 catch(e){$('msg').innerHTML='<span class="err">'+esc(e.message)+'</span>';$('send').disabled=false}
}
load();
</script></body></html>
