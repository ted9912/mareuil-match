<!doctype html>
<html lang="fr" translate="no">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="google" content="notranslate"><meta name="theme-color" content="#061827">
<title>Mareuil Match — Vote</title>
<style>
*{box-sizing:border-box}html{background:#041521}body{margin:0;min-height:100vh;color:#fff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 50% -15%,#14506d 0,#08283d 30%,#03131f 75%,#052b28 100%);overflow-x:hidden}.shell{width:min(1040px,100%);margin:auto;padding:18px 14px 42px}.brand{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:15px}.crest{width:58px;height:70px;flex:none;filter:drop-shadow(0 7px 14px #0008)}.brand h1{margin:0;font-size:27px;letter-spacing:.03em;font-weight:1000}.brand h1 span{color:#29e67b}.brand p{margin:3px 0 0;color:#aec4d0;font-size:12px;font-style:italic}.match{background:linear-gradient(110deg,#082d43,#0a2232 65%,#0d3a31);border:1px solid #1598db;border-radius:20px;padding:16px 18px;box-shadow:0 14px 38px #0007}.eyebrow{color:#27c9ff;text-transform:uppercase;letter-spacing:.13em;font-size:11px;font-weight:1000}.match h2{margin:3px 0 1px;font-size:28px}.date{margin:0;color:#aec6d3;font-size:14px}.voter{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;background:#09273a;border:1px solid #22637f;border-radius:17px}.voter label{font-size:13px;font-weight:1000;color:#c3d4dd;white-space:nowrap}.voter select{width:100%;padding:12px 14px;border:1px solid #3b6477;border-radius:12px;background:#061c2b;color:#fff;font-size:15px;font-weight:800;outline:none}.vote-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.section{background:linear-gradient(145deg,#062a42,#041c2c);border:2px solid #079ef0;border-radius:23px;padding:14px;box-shadow:0 0 22px #008cff25,0 14px 35px #0006}.section.flop{border-color:#ff3942;background:linear-gradient(145deg,#341620,#1d0e18);box-shadow:0 0 22px #ff273525,0 14px 35px #0006}.section-head{display:flex;align-items:center;gap:10px;min-height:83px;margin-bottom:10px}.icon{width:76px;height:76px;flex:none;display:grid;place-items:center}.icon svg{width:100%;height:100%;filter:drop-shadow(0 6px 8px #0008)}.section h3{margin:0;font-size:20px;line-height:1;font-weight:1000}.section h3 span{display:block;margin-top:5px;font-size:23px;font-style:italic}.top h3 span{color:#29e77b}.flop h3 span{color:#ff5057}.section small{display:block;margin-top:7px;color:#b9d1dc;font-size:10px;line-height:1.3;font-weight:800}.flop small{color:#ffd0d2}.players{display:grid;grid-template-columns:1fr 1fr;gap:7px}.players button{position:relative;min-height:49px;padding:7px 9px;border-radius:12px;border:1px solid #087eb8;background:#08263a;color:#f7fbff;font-size:13px;font-weight:850;text-align:left;display:flex;align-items:center;cursor:pointer;transition:transform .1s,background .1s,border .1s}.players button:active{transform:scale(.98)}.section.flop .players button{border-color:#a63a43;background:#321923}.players button.sel{background:linear-gradient(100deg,#087fc6,#0b4e78);border-color:#58d1ff;box-shadow:0 0 0 2px #58d1ff30}.section.flop .players button.sel{background:linear-gradient(100deg,#c72e39,#60202a);border-color:#ff8388}.players button.disabled{opacity:.28;text-decoration:line-through;cursor:not-allowed}.rank{width:25px;height:25px;min-width:25px;border-radius:50%;background:#fff;color:#0870a9;display:inline-flex;align-items:center;justify-content:center;margin-right:7px;font-size:12px;font-weight:1000}.flop .rank{color:#c4262f}.footer{margin-top:15px;padding:13px;background:#061b2af5;border:1px solid #23617a;border-radius:20px;box-shadow:0 10px 30px #0006}.counter{display:flex;justify-content:center;gap:24px;margin:0 0 10px;font-size:13px;font-weight:950}.counter .blue{color:#27cbff}.counter .red{color:#ff6269}.send{width:100%;padding:15px;border:0;border-radius:15px;background:linear-gradient(90deg,#2dcc55,#68e86e);color:#041309;font-size:17px;font-weight:1000;box-shadow:0 7px 20px #18a53e45;cursor:pointer}.send:disabled{opacity:.45;cursor:not-allowed}.msg{margin:8px 0 0;text-align:center}.err{color:#ff747b;font-weight:900}.muted{color:#a7bbc6}.success{text-align:center;padding:42px 10px}.success .big{font-size:55px}.success h2{font-size:26px;margin:10px 0 5px}
@media(max-width:700px){.shell{padding:12px 9px 25px}.brand{margin-bottom:12px}.crest{width:48px;height:60px}.brand h1{font-size:23px}.brand p{font-size:10px}.match{padding:14px}.match h2{font-size:24px}.voter{display:block;padding:11px}.voter label{display:block;margin-bottom:6px}.vote-grid{grid-template-columns:1fr;gap:12px}.section{padding:11px;border-radius:20px}.section-head{min-height:72px;margin-bottom:8px}.icon{width:68px;height:68px}.section h3{font-size:19px}.section h3 span{font-size:21px}.section small{font-size:10px}.players{grid-template-columns:1fr 1fr;gap:6px}.players button{min-height:48px;font-size:13px;padding:7px 8px}.rank{width:24px;height:24px;min-width:24px;margin-right:6px}.footer{margin-top:13px}.counter{gap:12px;font-size:12px}}
@media(max-width:360px){.players{grid-template-columns:1fr}.counter{gap:8px;font-size:11px}}
</style>
</head>
<body><main class="shell">
<header class="brand"><svg class="crest" viewBox="0 0 90 110" aria-label="Mareuil"><path d="M8 5h74v55c0 25-15 39-37 45C23 99 8 85 8 60Z" fill="#fff"/><path d="M12 10h66v49c0 20-12 32-33 39C24 91 12 79 12 59Z" fill="#eef7f5"/><path d="M15 57h60v11H15z" fill="#0a78bf"/><path d="M15 68h60v11H15z" fill="#25b75a"/><circle cx="45" cy="39" r="14" fill="#fff" stroke="#0b2233" stroke-width="4"/><path d="M37 39h16M45 31v16" stroke="#0b2233" stroke-width="3"/><text x="45" y="22" text-anchor="middle" font-size="10" font-weight="1000" fill="#10293a">MAREUIL</text><text x="45" y="96" text-anchor="middle" font-size="9" font-weight="1000" fill="#10293a">1971</text></svg><div><h1>MAREUIL <span>MATCH</span></h1><p>Plus qu'un club, une équipe !</p></div></header>
<div id="app" class="match">Chargement…</div>
</main>
<script>(function(){'use strict';var API='/api/vote',token=new URLSearchParams(location.search).get('token'),data=null,top=[],flop=[],app=document.getElementById('app');function esc(s){return String(s??'').replace(/[&<>\"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'})[c]})}function api(url,opt){opt=opt||{};var c=new AbortController(),t=setTimeout(function(){c.abort()},6000);opt.signal=c.signal;opt.cache='no-store';return fetch(url,opt).then(function(r){return r.text().then(function(x){var j;try{j=JSON.parse(x)}catch(e){throw new Error('Réponse invalide du serveur.')}if(!r.ok)throw new Error(j.error||'Erreur serveur.');return j})}).catch(function(e){if(e.name==='AbortError')throw new Error('Le serveur ne répond pas.');throw e}).finally(function(){clearTimeout(t)})}function error(m){app.innerHTML='<div class="success"><div class="big">⚽</div><h2>Mareuil Match</h2><p class="err">'+esc(m)+'</p></div>'}function load(){if(!token){error('Lien de vote incomplet.');return}api(API+'?token='+encodeURIComponent(token)).then(function(j){data=j;render()}).catch(function(e){error(e.message)})}function wave(){return '<svg viewBox="0 0 120 100"><path d="M7 70C25 37 38 72 55 46s30 24 58-10" fill="none" stroke="#0788df" stroke-width="9" stroke-linecap="round"/><path d="M10 77c19-13 34 13 54-3s31 9 48-5" fill="none" stroke="#39c8ff" stroke-width="6" stroke-linecap="round"/><path d="M24 84c17-7 29 7 45-3s25 6 38-2" fill="none" stroke="#bdeeff" stroke-width="3" stroke-linecap="round"/><path d="M71 20c7-12 22-12 28-2 11-4 22 4 20 15-2 9-11 13-20 12H70c-14 0-20-17-9-25 3-2 6-3 10 0Z" fill="#fff"/><path d="M80 18c4-5 12-5 16 1" fill="none" stroke="#0a7fd1" stroke-width="4" stroke-linecap="round"/></svg>'}function rain(){return '<svg viewBox="0 0 120 100"><path d="M25 53h67c9 0 16-7 16-15 0-12-12-20-23-17-7-13-27-16-39-3-13-3-27 6-27 20 0 7 2 11 6 15Z" fill="#7d91a0" stroke="#d8e2e8" stroke-width="3"/><path d="M38 61l-5 18M59 61l-5 18M80 61l-5 18" stroke="#ff4148" stroke-width="7" stroke-linecap="round"/><path d="M47 59l-5 18M69 59l-5 18" stroke="#ff777c" stroke-width="3" stroke-linecap="round"/></svg>'}function render(){app.innerHTML='';var e=document.createElement('div');e.className='eyebrow';e.textContent='MATCH DU JOUR';app.appendChild(e);var h=document.createElement('h2');h.textContent=data.match.opponent;app.appendChild(h);var p=document.createElement('p');p.className='date';p.textContent=new Date(data.match.match_date+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});app.appendChild(p);var vc=document.createElement('div');vc.className='voter';vc.innerHTML='<label>QUI VOTE ?</label><select id="voter"><option value="">Choisis ton nom</option>'+data.voters.map(function(v){return '<option value="'+esc(v.id)+'">'+esc(v.name)+'</option>'}).join('')+'</select>';app.appendChild(vc);var grid=document.createElement('div');grid.className='vote-grid';app.appendChild(grid);group(grid,'top','MAREUILLAIS','SUR LE LAY','Ceux qui ont régalé','Clique sur 4 joueurs : 1er clic = 1er, puis 2e, 3e, 4e.',wave());group(grid,'flop','MAREUILLAIS','SOUS LE LAY','Ceux qui ont moins régalé','Clique sur 4 joueurs : 1er clic = 1er, puis 2e, 3e, 4e.',rain());var f=document.createElement('div');f.className='footer';f.innerHTML='<p id="counter" class="counter"><span class="blue">🌊 Sur le Lay 0/4</span><span class="red">🌧️ Sous le Lay 0/4</span></p><button id="send" class="send">➤ &nbsp; Valider mon vote</button><p id="msg" class="msg"></p>';app.appendChild(f);document.getElementById('voter').addEventListener('change',function(){top=[];flop=[];draw();check()});document.getElementById('send').addEventListener('click',submit);draw();check()}function group(parent,k,a,b,sub,instr,icon){var c=document.createElement('section');c.className='section '+k;var hd=document.createElement('div');hd.className='section-head';var ic=document.createElement('div');ic.className='icon';ic.innerHTML=icon;hd.appendChild(ic);var tx=document.createElement('div');tx.innerHTML='<h3>'+a+'<span>'+b+'</span></h3><small>'+sub+'<br>'+instr+'</small>';hd.appendChild(tx);c.appendChild(hd);var g=document.createElement('div');g.id=k;g.className='players';c.appendChild(g);parent.appendChild(c)}function voter(){var e=document.getElementById('voter');return e&&e.value?data.voters.find(function(v){return v.id===e.value}):null}function own(){var v=voter();if(!v)return null;if(v.player_id)return v.player_id;var n=String(v.name||'').trim().toLowerCase();var p=data.players.find(function(x){return String(x.name||'').trim().toLowerCase()===n});return p?p.id:null}function draw(){[['top',top],['flop',flop]].forEach(function(pair){var k=pair[0],a=pair[1],box=document.getElementById(k);box.innerHTML='';var mine=own();data.players.forEach(function(p){var b=document.createElement('button'),isMine=mine&&p.id===mine,i=a.indexOf(p.id);if(isMine){b.className='disabled';b.disabled=true;b.textContent=p.name+' · Toi'}else{if(i>=0)b.className='sel';b.innerHTML=(i>=0?'<span class="rank">'+(i+1)+'</span>':'')+esc(p.name);b.addEventListener('click',function(){var n=a.indexOf(p.id);if(n>=0)a.splice(n,1);else if(a.length<4)a.push(p.id);draw();check()})}box.appendChild(b)})})}function check(){var c=document.getElementById('counter'),d=new Set(top.concat(flop)).size;if(c)c.innerHTML='<span class="blue">🌊 Sur le Lay '+top.length+'/4</span><span class="red">🌧️ Sous le Lay '+flop.length+'/4</span>'+(d<top.length+flop.length?' <span class="err">· doublon interdit</span>':'')}async function submit(){var v=document.getElementById('voter'),s=document.getElementById('send'),m=document.getElementById('msg'),d=new Set(top.concat(flop)).size;if(!v.value){m.className='msg err';m.textContent='Choisis ton nom.';return}if(top.length!==4||flop.length!==4||d!==8){m.className='msg err';m.textContent='Choisis 4 joueurs dans chaque catégorie, sans doublon.';return}s.disabled=true;m.className='msg muted';m.textContent='Envoi du vote…';var body={token:token,voter_id:v.value};top.forEach(function(x,i){body['top_'+(i+1)]=x});flop.forEach(function(x,i){body['flop_'+(i+1)]=x});try{await api(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});app.innerHTML='<div class="success"><div class="big">🌊</div><h2>Vote enregistré !</h2><p class="muted">Merci pour ton vote. Rendez-vous au prochain match !</p></div>'}catch(e){m.className='msg err';m.textContent=e.message;s.disabled=false}}load()})();</script>
</body></html>
