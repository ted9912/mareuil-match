<!doctype html><html lang="fr" translate="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="google" content="notranslate"><meta name="theme-color" content="#071a2b"><title>Mareuil Match — Vote</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#06111d,#0a2130 55%,#071a25);color:#fff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}main{max-width:720px;margin:auto;padding:18px 14px 34px}.brand{text-align:center;padding:8px 0 16px}.mark{width:58px;height:58px;margin:auto;border-radius:18px;background:linear-gradient(145deg,#0d77c8,#55c85a);display:grid;place-items:center;box-shadow:0 10px 30px #0006;font-weight:950;font-size:22px}.brand h1{margin:10px 0 2px;font-size:25px;letter-spacing:.04em}.brand p{margin:0;color:#9db0bd;font-size:13px}.match{background:#fff;color:#071a2b;border-radius:24px;padding:20px;box-shadow:0 18px 50px #0005}.match .eyebrow{text-transform:uppercase;letter-spacing:.12em;color:#1976b9;font-size:11px;font-weight:900}.match h2{margin:5px 0;font-size:27px}.date{color:#667786}.section{margin-top:16px;background:#10293a;border:1px solid #284557;border-radius:22px;padding:16px}.section-head{display:flex;align-items:center;gap:12px}.icon{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;flex:0 0 auto}.wave{background:#dff3ff}.rain{background:#dfe9f0}.section h3{margin:0;font-size:18px}.section small{display:block;color:#91a6b5;margin-top:2px}.players{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.players button{border:1px solid #355264;background:#0b2030;color:#f5fbff;min-height:52px;border-radius:14px;padding:10px 8px;font-weight:800;font-size:14px;transition:.15s}.players button.sel{background:#1e7fbe;border-color:#65c4ff;box-shadow:0 0 0 2px #65c4ff33}.players button.flop.sel{background:#405b70;border-color:#9fb5c3}.players button.disabled{opacity:.3;text-decoration:line-through}.rank{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:#fff;color:#11649b;margin-right:5px;font-size:12px}.flop .rank{color:#3c5261}.voter{margin-top:16px}.voter label{display:block;font-size:12px;font-weight:900;color:#9db0bd;margin:0 0 7px;text-transform:uppercase;letter-spacing:.08em}.voter select{width:100%;padding:15px;border:1px solid #38566a;background:#081c2a;color:#fff;border-radius:14px;font-size:16px;font-weight:700}.footer{position:sticky;bottom:10px;margin-top:18px;background:#071a28ee;backdrop-filter:blur(14px);padding:12px;border-radius:20px;border:1px solid #2c4a5b}.counter{text-align:center;color:#9db0bd;font-weight:800;font-size:13px;margin:0 0 9px}.send{width:100%;border:0;border-radius:15px;padding:16px;background:linear-gradient(90deg,#49c45b,#69dc6d);color:#06150b;font-size:17px;font-weight:950}.send:disabled{opacity:.45}.err{color:#ff8f8f;font-weight:800;text-align:center}.success{text-align:center;padding:38px 12px}.success .big{font-size:52px}.success h2{font-size:26px}.muted{color:#9db0bd}@media(max-width:420px){.players{grid-template-columns:1fr}.match h2{font-size:24px}}</style></head><body><main><div class="brand"><div class="mark">MM</div><h1>MAREUIL MATCH</h1><p>Le vote du vestiaire</p></div><div id="app" class="match">Chargement…</div></main><script>(function(){'use strict';var API='/api/vote',token=new URLSearchParams(location.search).get('token'),data=null,top=[],flop=[],app=document.getElementById('app');function esc(s){return String(s??'').replace(/[&<>\"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'})[c]})}function showError(m){app.innerHTML='<div class="success"><div class="big">⚽</div><h2>Mareuil Match</h2><p class="err">'+esc(m)+'</p></div>'}function api(url,opt){opt=opt||{};var c=new AbortController(),t=setTimeout(function(){c.abort()},6000);opt.signal=c.signal;opt.cache='no-store';return fetch(url,opt).then(function(r){return r.text().then(function(x){var j;try{j=JSON.parse(x)}catch(e){throw new Error('Réponse invalide du serveur.')}if(!r.ok)throw new Error(j.error||'Erreur serveur.');return j})}).catch(function(e){if(e.name==='AbortError')throw new Error('Le serveur ne répond pas.');throw e}).finally(function(){clearTimeout(t)})}function load(){if(!token){showError('Lien de vote incomplet.');return}api(API+'?token='+encodeURIComponent(token)).then(function(j){data=j;render()}).catch(function(e){showError(e.message)})}function svgWave(){return '<svg width="30" height="30" viewBox="0 0 40 40" fill="none"><path d="M3 24c7-12 13 12 20 0s13 12 14-2" stroke="#1685c9" stroke-width="4" stroke-linecap="round"/></svg>'}function svgRain(){return '<svg width="30" height="30" viewBox="0 0 40 40" fill="none"><path d="M8 21h24c2 0 4-2 4-4 0-4-4-7-8-6-2-5-10-6-13-1-5-1-9 2-9 6 0 3 1 5 2 5Z" fill="#5e7483"/><path d="M13 27l-2 5M20 27l-2 5M27 27l-2 5" stroke="#2b9dd7" stroke-width="3" stroke-linecap="round"/></svg>'}function render(){app.innerHTML='';var e=document.createElement('div');e.className='eyebrow';e.textContent='MATCH DU JOUR';app.appendChild(e);var h=document.createElement('h2');h.textContent=data.match.opponent;app.appendChild(h);var p=document.createElement('p');p.className='date';p.textContent=new Date(data.match.match_date+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});app.appendChild(p);var vc=document.createElement('div');vc.className='voter';vc.innerHTML='<label>Qui vote ?</label><select id="voter"><option value="">Choisis ton nom</option>'+data.voters.map(function(v){return '<option value="'+esc(v.id)+'">'+esc(v.name)+'</option>'}).join('')+'</select>';app.appendChild(vc);makeGroup('top','MAREUILLAIS SUR LE LAY','🌊 Ceux qui ont régalé',svgWave());makeGroup('flop','MAREUILLAIS SOUS LE LAY','🌧️ Ceux qui ont moins régalé',svgRain());var f=document.createElement('div');f.className='footer';f.innerHTML='<p id="counter" class="counter"></p><button id="send" class="send">Valider mon vote</button><p id="msg"></p>';app.appendChild(f);document.getElementById('voter').addEventListener('change',function(){top=[];flop=[];draw();check()});document.getElementById('send').addEventListener('click',submit);draw();check()}function makeGroup(k,t,sub,icon){var c=document.createElement('div');c.className='section '+k;var hd=document.createElement('div');hd.className='section-head';var ic=document.createElement('div');ic.className='icon';ic.innerHTML=icon;hd.appendChild(ic);var tx=document.createElement('div');tx.innerHTML='<h3>'+t+'</h3><small>'+sub+'</small>';hd.appendChild(tx);c.appendChild(hd);var g=document.createElement('div');g.id=k;g.className='players';c.appendChild(g);app.appendChild(c)}function selectedVoter(){var e=document.getElementById('voter');return e&&e.value?data.voters.find(function(v){return v.id===e.value}):null}function ownPlayerId(){var v=selectedVoter();if(!v)return null;if(v.player_id)return v.player_id;var n=String(v.name||'').trim().toLowerCase();var p=data.players.find(function(x){return String(x.name||'').trim().toLowerCase()===n});return p?p.id:null}function draw(){[['top',top],['flop',flop]].forEach(function(pair){var k=pair[0],a=pair[1],box=document.getElementById(k);box.innerHTML='';var own=ownPlayerId();data.players.forEach(function(p){var b=document.createElement('button'),mine=own&&p.id===own,i=a.indexOf(p.id);if(i>=0)b.className='sel';if(mine){b.className='disabled';b.disabled=true;b.textContent=p.name+' · Toi'}else{var pos=i>=0?i+1:0;b.innerHTML=(pos?'<span class="rank">'+pos+'</span>':'')+esc(p.name);b.addEventListener('click',function(){var n=a.indexOf(p.id);if(n>=0)a.splice(n,1);else if(a.length<4)a.push(p.id);draw();check()})}box.appendChild(b)})})}function check(){var counter=document.getElementById('counter'),distinct=new Set(top.concat(flop)).size;if(counter)counter.textContent='Sur le Lay '+top.length+'/4  ·  Sous le Lay '+flop.length+'/4'+(distinct<top.length+flop.length?'  ·  Un joueur ne peut être dans les deux':'')}async function submit(){var voter=document.getElementById('voter'),send=document.getElementById('send'),msg=document.getElementById('msg'),distinct=new Set(top.concat(flop)).size;if(!voter.value){msg.className='err';msg.textContent='Choisis ton nom.';return}if(top.length!==4||flop.length!==4||distinct!==8){msg.className='err';msg.textContent='Choisis 4 joueurs dans chaque catégorie, sans doublon.';return}send.disabled=true;msg.className='muted';msg.textContent='Envoi du vote…';var body={token:token,voter_id:voter.value};top.forEach(function(x,i){body['top_'+(i+1)]=x});flop.forEach(function(x,i){body['flop_'+(i+1)]=x});try{await api(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});app.innerHTML='<div class="success"><div class="big">🌊</div><h2>Vote enregistré !</h2><p class="muted">Merci pour ton vote. Rendez-vous au prochain match !</p></div>'}catch(e){msg.className='err';msg.textContent=e.message;send.disabled=false}}load()})();</script></body></html>
