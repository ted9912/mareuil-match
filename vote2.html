<!doctype html>
<html lang="fr" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="google" content="notranslate">
<title>Mareuil Match — Vote</title>
<style>
body{margin:0;background:#06110a;color:white;font-family:Arial,sans-serif}
main{max-width:680px;margin:auto;padding:18px}
.card{background:#102017;border:1px solid #29432f;border-radius:20px;padding:18px;margin:12px 0}
h1{color:#61df4c}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
button,select{width:100%;padding:14px;border-radius:12px;font-size:16px}
button{border:2px solid #304237;background:#0b160f;color:white;font-weight:bold}
.top .sel{border-color:#61df4c;background:#122d16}
.flop .sel{border-color:#ef5350;background:#301515}
select{background:white;color:#111;border:0}
.send{background:#61df4c;color:#071008;border:0;margin-top:10px}
.send:disabled{opacity:.4}
.err{color:#ff7777;font-weight:bold}
.muted{color:#aeb8b0}
</style>
</head>
<body>
<main>
<div id="app" class="card">Chargement…</div>
</main>

<script>
const API='/api/vote';
const token=new URLSearchParams(location.search).get('token');
let data,top=[],flop=[];
const app=document.getElementById('app');

async function api(url,opt={}){
 const c=new AbortController();
 const t=setTimeout(()=>c.abort(),8000);
 try{
  const r=await fetch(url,{...opt,signal:c.signal,cache:'no-store'});
  const text=await r.text();
  let j;
  try{j=JSON.parse(text)}catch{throw Error('Réponse invalide du serveur.')}
  if(!r.ok)throw Error(j.error||'Erreur serveur.');
  return j;
 }catch(e){
  if(e.name==='AbortError')throw Error('Le serveur ne répond pas.');
  throw e;
 }finally{clearTimeout(t)}
}

async function load(){
 if(!token){
  app.innerHTML='<h1>⚽ Mareuil Match</h1><p class="err">Lien de vote incomplet.</p>';
  return;
 }
 try{
  data=await api(API+'?token='+encodeURIComponent(token));
  render();
 }catch(e){
  app.innerHTML='<h1>⚽ Mareuil Match</h1><p class="err">'+e.message+'</p>';
 }
}

function render(){
 app.innerHTML=
 '<h1>⚽ Mareuil Match</h1>'+
 '<p class="muted">'+data.match.opponent+' · '+new Date(data.match.match_date+'T12:00:00').toLocaleDateString('fr-FR')+'</p>'+
 '<div class="card"><select id="voter"><option value="">Choisis ton nom</option>'+
 data.voters.map(v=>'<option value="'+v.id+'">'+v.name+'</option>').join('')+
 '</select></div>'+
 '<div class="card top"><h2>🟢 TOP</h2><p class="muted">Classe tes 4 meilleurs joueurs</p><div id="top" class="grid"></div></div>'+
 '<div class="card flop"><h2>🔴 FLOP</h2><p class="muted">Classe tes 4 moins bons joueurs</p><div id="flop" class="grid"></div></div>'+
 '<div class="card"><button id="send" class="send" disabled>Valider mon vote</button><p id="msg"></p></div>';

 draw();
 document.getElementById('voter').onchange=check;
 document.getElementById('send').onclick=submit;
}

function draw(){
 [['top',top],['flop',flop]].forEach(([kind,arr])=>{
  const box=document.getElementById(kind);
  box.innerHTML='';
  data.players.forEach(p=>{
   const b=document.createElement('button');
   const i=arr.indexOf(p.id);
   b.className=i>=0?'sel':'';
   b.textContent=p.name+(i>=0?' · '+(kind==='top'?[4,3,2,1][i]:'−'+[4,3,2,1][i]):'');
   b.onclick=()=>{
    if(arr.includes(p.id))arr.splice(arr.indexOf(p.id),1);
    else if(arr.length<4)arr.push(p.id);
    draw();check();
   };
   box.appendChild(b);
  });
 });
}

function check(){
 const distinct=new Set([...top,...flop]).size;
 document.getElementById('send').disabled=
 !(document.getElementById('voter').value&&top.length===4&&flop.length===4&&distinct===8);
}

async function submit(){
 const msg=document.getElementById('msg');
 document.getElementById('send').disabled=true;
 msg.textContent='Envoi…';

 const body={token,voter_id:document.getElementById('voter').value};
 top.forEach((x,i)=>body['top_'+(i+1)]=x);
 flop.forEach((x,i)=>body['flop_'+(i+1)]=x);

 try{
  await api(API,{
   method:'POST',
   headers:{'Content-Type':'application/json'},
   body:JSON.stringify(body)
  });
  app.innerHTML='<div style="text-align:center;padding:40px"><h1>✅ Vote enregistré</h1><p>Merci pour ton vote !</p></div>';
 }catch(e){
  msg.innerHTML='<span class="err">'+e.message+'</span>';
  document.getElementById('send').disabled=false;
 }
}

load();
</script>
</body>
</html>
