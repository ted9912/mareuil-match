<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061827"><title>Mareuil Match — Vote</title><style>*{box-sizing:border-box}body{margin:0;color:#fff;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 50% -10%,#15506b,#061d2d 40%,#03131f 82%);min-height:100vh}.shell{max-width:1050px;margin:auto;padding:14px 10px 30px}.brand{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:12px}.crest{width:50px;height:62px}.brand h1{margin:0;font-size:25px}.brand h1 span{color:#29e67b}.brand p{margin:1px 0;color:#aec4d0;font-size:10px;font-style:italic}.match{background:linear-gradient(110deg,#082d43,#071f2f 65%,#0d392f);border:1px solid #1598db;border-radius:19px;padding:14px;box-shadow:0 14px 35px #0007}.eyebrow{color:#25d17b;text-transform:uppercase;font-size:11px;font-weight:900}.match h2{margin:2px 0;font-size:25px}.date{margin:0;color:#abc3cf}.voter{display:flex;gap:9px;align-items:center;margin-top:10px;padding:9px;background:#09273a;border:1px solid #22637f;border-radius:15px}.voter label{font-weight:900;white-space:nowrap}.voter select{flex:1;padding:11px;border-radius:11px;background:#061c2b;color:#fff;border:1px solid #3b6477;font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.sec{border:2px solid #079ef0;border-radius:19px;padding:10px;background:linear-gradient(145deg,#062a42,#041c2c)}.sec.flop{border-color:#ff3942;background:linear-gradient(145deg,#341620,#1d0e18)}.head{display:flex;align-items:center;gap:7px}.logo{width:130px;height:90px;object-fit:contain}.head h3{margin:0;font-size:18px}.head h3 span{display:block;color:#29e77b;font-size:22px;font-style:italic}.flop h3 span{color:#ff5057}.head small{display:block;margin-top:6px;font-size:9px;line-height:1.25;font-weight:800}.players{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:7px}.players button{min-height:43px;padding:6px 7px;border-radius:9px;border:1px solid #087eb8;background:#08263a;color:#fff;font-size:12px;font-weight:800;text-align:left}.flop .players button{border-color:#a63a43;background:#321923}.players .sel{background:linear-gradient(90deg,#087fc6,#0b4e78);border-color:#58d1ff}.flop .players .sel{background:linear-gradient(90deg,#c72e39,#60202a);border-color:#ff8388}.players .disabled{opacity:.3;text-decoration:line-through}.rank{display:inline-flex;width:22px;height:22px;border-radius:50%;background:#fff;color:#0870a9;align-items:center;justify-content:center;margin-right:5px}.flop .rank{color:#c4262f}.foot{margin-top:10px;padding:10px;background:#061b2af5;border:1px solid #23617a;border-radius:17px}.count{display:flex;justify-content:center;gap:20px;font-size:12px;font-weight:900}.blue{color:#27cbff}.red{color:#ff6269}.send{width:100%;padding:14px;border:0;border-radius:13px;background:linear-gradient(90deg,#2dcc55,#68e86e);font-size:16px;font-weight:1000}.err{color:#ff747b;font-weight:900;text-align:center}.ok{text-align:center;padding:40px}.ok b{font-size:52px}@media(max-width:700px){.shell{padding:10px 7px}.brand h1{font-size:22px}.crest{width:45px;height:55px}.voter{display:block}.voter label{display:block;margin-bottom:5px}.grid{gap:7px}.sec{padding:7px;border-radius:16px}.head{display:block;text-align:center}.logo{width:100%;height:72px}.head h3{font-size:15px}.head h3 span{font-size:17px}.head small{font-size:7.5px}.players{grid-template-columns:1fr}.players button{font-size:11px;min-height:40px}.count{font-size:11px;gap:9px}}</style></head><body><main class="shell"><header class="brand"><svg class="crest" viewBox="0 0 90 110"><path d="M8 5h74v55c0 25-15 39-37 45C23 99 8 85 8 60Z" fill="#fff"/><path d="M12 10h66v49c0 20-12 32-33 39C24 91 12 79 12 59Z" fill="#eef7f5"/><path d="M15 57h60v11H15z" fill="#0a78bf"/><path d="M15 68h60v11H15z" fill="#25b75a"/><circle cx="45" cy="39" r="14" fill="#fff" stroke="#0b2233" stroke-width="4"/><text x="45" y="22" text-anchor="middle" font-size="10" font-weight="900">MAREUIL</text><text x="45" y="96" text-anchor="middle" font-size="9" font-weight="900">1971</text></svg><div><h1>MAREUIL <span>MATCH</span></h1><p>Plus qu'un club, une équipe !</p></div></header><div id="app" class="match">Chargement…</div></main><script>
const API='/api/vote',token=new URLSearchParams(location.search).get('token'),RAW='https://raw.githubusercontent.com/ted9912/mareuil-match/main/assets/',app=document.querySelector('#app');let d,T=[],F=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(u,o){let r=await fetch(u,o||{}),x=await r.text(),j;try{j=JSON.parse(x)}catch{throw Error('Réponse invalide du serveur.')}if(!r.ok)throw Error(j.error||'Erreur serveur.');return j}
async function asset(n){let x=await fetch(RAW+n+'.b64').then(r=>r.text());return 'data:image/webp;base64,'+x.trim()}
function fail(x){app.innerHTML='<div class="ok"><b>⚽</b><h2>Mareuil Match</h2><p class="err">'+esc(x)+'</p></div>'}
async function load(){if(!token)return fail('Lien de vote incomplet.');try{let d0=await api(API+'?token='+encodeURIComponent(token));d=d0;let [w,r]=await Promise.all([asset('wave'),asset('rain')]);render(w,r)}catch(e){fail(e.message)}}
function render(w,r){app.innerHTML='<div class="eyebrow">MATCH DU JOUR</div><h2>'+esc(d.match.opponent)+'</h2><p class="date">'+new Date(d.match.match_date+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'</p><div class="voter"><label>QUI VOTE ?</label><select id="v"><option value="">Choisis ton nom</option>'+d.voters.map(v=>'<option value="'+v.id+'">'+esc(v.name)+'</option>').join('')+'</select></div><div class="grid"><section class="sec"><div class="head"><img id="wave" class="logo"><div><h3>MAREUILLAIS<span>SUR LE LAY</span></h3><small>CEUX QUI ONT LE PLUS RÉGALÉ !<br>Clique sur 4 joueurs : 1er, 2e, 3e, 4e.</small></div></div><div id="top" class="players"></div></section><section class="sec flop"><div class="head"><img id="rain" class="logo"><div><h3>MAREUILLAIS<span>SOUS LE LAY</span></h3><small>CEUX QUI ONT UN PEU MOINS RÉGALÉ !<br>Clique sur 4 joueurs : 1er, 2e, 3e, 4e.</small></div></div><div id="flop" class="players"></div></section></div><div class="foot"><p id="count" class="count"><span class="blue">🌊 Sur le Lay 0/4</span><span class="red">🌧️ Sous le Lay 0/4</span></p><button id="send" class="send" disabled>➤ &nbsp; Valider mon vote</button><p id="msg"></p></div>';document.querySelector('#wave').src=w;document.querySelector('#rain').src=r;document.querySelector('#v').onchange=draw;document.querySelector('#send').onclick=submit;draw()}
function own(){let v=d.voters.find(x=>x.id===document.querySelector('#v').value);if(!v)return null;if(v.player_id)return v.player_id;let p=d.players.find(x=>x.name.trim().toLowerCase()===v.name.trim().toLowerCase());return p?.id||null}
function draw(){[['top',T],['flop',F]].forEach(([k,a])=>{let box=document.querySelector('#'+k);box.innerHTML='';let me=own();d.players.forEach(p=>{let b=document.createElement('button'),i=a.indexOf(p.id);if(me===p.id){b.className='disabled';b.disabled=true;b.textContent=p.name+' · Toi'}else{if(i>=0)b.className='sel';b.innerHTML=(i>=0?'<span class="rank">'+(i+1)+'</span>':'')+esc(p.name);b.onclick=()=>{let n=a.indexOf(p.id);if(n>=0)a.splice(n,1);else if(a.length<4)a.push(p.id);draw()}}box.appendChild(b)})});document.querySelector('#count').innerHTML='<span class="blue">🌊 Sur le Lay '+T.length+'/4</span><span class="red">🌧️ Sous le Lay '+F.length+'/4</span>';let ok=document.querySelector('#v').value&&T.length===4&&F.length===4&&new Set(T.concat(F)).size===8;document.querySelector('#send').disabled=!ok}
async function submit(){let s=document.querySelector('#send'),m=document.querySelector('#msg');s.disabled=true;let b={token:token,voter_id:document.querySelector('#v').value};T.forEach((x,i)=>b['top_'+(i+1)]=x);F.forEach((x,i)=>b['flop_'+(i+1)]=x);try{await api(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});app.innerHTML='<div class="ok"><b>🌊</b><h2>Vote enregistré !</h2><p>Merci pour ton vote.</p></div>'}catch(e){m.className='err';m.textContent=e.message;s.disabled=false}}load();
</script></body></html>
