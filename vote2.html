<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061827"><title>Mareuil Match — Vote</title><style>*{box-sizing:border-box}body{margin:0;color:#fff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#031827 url("/assets/mareuil-bg-high.jpg?v=20260918-2") center center/100% 100% fixed no-repeat;min-height:100vh;position:relative}body:before{content:"";position:fixed;inset:0;background:linear-gradient(180deg,#0318272b 0%,#03182755 45%,#03131fb5 100%);z-index:-1}.shell{max-width:1050px;margin:auto;padding:14px 10px 35px}.brand{text-align:center;margin-bottom:12px;min-height:205px;padding-top:8px;background:transparent}.brand h1{margin:0;font-size:25px;letter-spacing:.08em}.brand h1 span{color:#35df79}.brand p{margin:2px 0;color:#aac0cc;font-size:10px;font-style:italic}.crest{display:none}.match{background:linear-gradient(145deg,#082b40b8,#061b2acc);border:1px solid #23647e;border-radius:24px;padding:15px;box-shadow:0 20px 55px #0008}.eyebrow{color:#35df79;text-transform:uppercase;letter-spacing:.14em;font-size:10px;font-weight:950}.match h2{margin:3px 0;font-size:25px}.date{margin:0;color:#a9c0ca;font-size:13px}.voter{display:flex;gap:10px;align-items:center;margin-top:13px;padding:10px;background:#061a29;border:1px solid #31566a;border-radius:15px}.voter label{font-size:11px;font-weight:950;white-space:nowrap}.voter select{flex:1;padding:11px;border-radius:11px;background:#0b2536;color:#fff;border:1px solid #426778;font-size:14px;outline:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.sec{border:1px solid #159de0;border-radius:21px;padding:11px;background:linear-gradient(145deg,#07334cc7,#041c2bbf);box-shadow:0 10px 28px #0003}.sec.flop{border-color:#e7444e;background:linear-gradient(145deg,#3a1822,#1d0d16)}.head{text-align:center}.logo{width:145px;height:82px;object-fit:contain;margin:auto;display:block}.head h3{margin:0;font-size:16px;letter-spacing:.04em}.head h3 span{display:block;color:#35df79;font-size:24px;font-style:italic;line-height:1.05}.flop h3 span{color:#ff646b}.head small{display:block;margin-top:7px;color:#b6c7ce;font-size:9px;line-height:1.3;font-weight:800}.players{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}.players button{min-height:45px;padding:7px;border-radius:11px;border:1px solid #176f99;background:rgba(8,40,59,.52);color:#fff;font-size:12px;font-weight:850;text-align:left;cursor:pointer;transition:.15s}.players button:active{transform:scale(.98)}.flop .players button{border-color:#86323d;background:rgba(50,23,32,.52)}.players .sel{background:linear-gradient(90deg,#0789d1,#0a527e);border-color:#6ad9ff;box-shadow:0 0 0 1px #4bc5ef55}.flop .players .sel{background:linear-gradient(90deg,#cf303c,#70222d);border-color:#ff858a}.players .disabled{opacity:.34;text-decoration:line-through;cursor:not-allowed}.rank{display:inline-flex;width:23px;height:23px;border-radius:50%;background:#fff;color:#086d9f;align-items:center;justify-content:center;margin-right:5px;font-weight:950}.flop .rank{color:#c12630}.foot{margin-top:12px;padding:11px;background:#051725;border:1px solid #2a6075;border-radius:18px;position:sticky;bottom:8px;box-shadow:0 14px 30px #0008}.count{display:flex;justify-content:center;gap:24px;margin:0 0 9px;font-size:12px;font-weight:950}.blue{color:#48ceff}.red{color:#ff747b}.send{width:100%;padding:14px;border:0;border-radius:13px;background:linear-gradient(90deg,#2ecb59,#70e878);color:#032012;font-size:16px;font-weight:950;cursor:pointer;box-shadow:0 7px 18px #25bf5544}.send:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}.err{color:#ff858b;font-weight:900;text-align:center}.ok{text-align:center;padding:45px 10px}.ok .big{font-size:60px}.ok h2{font-size:28px}.ok p{color:#b8cad2}@media(max-width:700px){.shell{padding:9px 6px 25px}.brand h1{font-size:21px}.crest{width:44px;height:53px}.match{padding:10px;border-radius:19px}.match h2{font-size:22px}.grid{gap:7px}.sec{padding:7px;border-radius:17px}.logo{width:100%;height:70px}.head h3{font-size:13px}.head h3 span{font-size:18px}.head small{font-size:7.5px}.players{grid-template-columns:1fr;gap:5px}.players button{min-height:41px;font-size:11px}.count{font-size:10px;gap:10px}.voter{display:block}.voter label{display:block;margin-bottom:5px}}@media(max-width:360px){.grid{grid-template-columns:1fr}.players{grid-template-columns:1fr 1fr}.head{display:grid;grid-template-columns:82px 1fr;align-items:center;text-align:left}.logo{width:82px}.head h3 span{font-size:18px}}</style></head><body><main class="shell"><header class="brand"><svg class="crest" viewBox="0 0 90 110"><path d="M8 5h74v55c0 25-15 39-37 45C23 99 8 85 8 60Z" fill="#fff"/><path d="M12 10h66v49c0 20-12 32-33 39C24 91 12 79 12 59Z" fill="#eef7f5"/><path d="M15 57h60v11H15z" fill="#0a78bf"/><path d="M15 68h60v11H15z" fill="#25b75a"/><circle cx="45" cy="39" r="14" fill="#fff" stroke="#0b2233" stroke-width="4"/><text x="45" y="22" text-anchor="middle" font-size="10" font-weight="900">MAREUIL</text><text x="45" y="96" text-anchor="middle" font-size="9" font-weight="900">1971</text></svg><h1>MAREUIL <span>MATCH</span></h1><p>Plus qu'un club, une équipe !</p></header><div id="app" class="match">Chargement…</div></main><script>const API='/api/vote',token=new URLSearchParams(location.search).get('token'),RAW='https://raw.githubusercontent.com/ted9912/mareuil-match/main/assets/',app=document.querySelector('#app');let d,T=[],F=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(u,o){let r=await fetch(u,o||{}),x=await r.text(),j;try{j=JSON.parse(x)}catch{throw Error('Réponse invalide du serveur.')}if(!r.ok)throw Error(j.error||'Erreur serveur.');return j}async function asset(n){let x=await fetch(RAW+n+'.b64').then(r=>r.text());return'data:image/webp;base64,'+x.trim()}function fail(x){app.innerHTML='<div class="ok"><div class="big">⚽</div><h2>Mareuil Match</h2><p class="err">'+esc(x)+'</p></div>'}async function load(){if(!token)return fail('Lien de vote incomplet.');try{d=await api(API+'?token='+encodeURIComponent(token));let[w,r]=await Promise.all([asset('wave'),asset('rain')]);render(w,r)}catch(e){fail(e.message)}}function render(w,r){app.innerHTML='<div class="eyebrow">MATCH DU JOUR</div><h2>'+esc(d.match.opponent)+'</h2><p class="date">'+new Date(d.match.match_date+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'</p><div class="voter"><label>QUI VOTE ?</label><select id="v"><option value="">Choisis ton nom</option>'+d.voters.map(v=>'<option value="'+v.id+'">'+esc(v.name)+'</option>').join('')+'</select></div><div class="grid"><section class="sec"><div class="head"><img id="wave" class="logo"><div><h3>MAREUILLAIS<span>SUR LE LAY</span></h3><small>🐐 LES MEILLEURS DU MATCH<br>Clique 4 fois : 1er, 2e, 3e, 4e.</small></div></div><div id="top" class="players"></div></section><section class="sec flop"><div class="head"><img id="rain" class="logo"><div><h3>MAREUILLAIS<span>SOUS LE LAY</span></h3><small>🐐 LES CHÈVRES DU MATCH<br>Clique 4 fois : 1er, 2e, 3e, 4e.</small></div></div><div id="flop" class="players"></div></section></div><div class="foot"><p id="count" class="count"><span class="blue">🌊 Sur le Lay 0/4</span><span class="red">🌧️ Sous le Lay 0/4</span></p><button id="send" class="send" disabled>➤ &nbsp; Valider mon vote</button><p id="msg"></p></div>';document.querySelector('#wave').src=w;document.querySelector('#rain').src=r;document.querySelector('#v').onchange=draw;document.querySelector('#send').onclick=submit;draw()}function own(){let v=d.voters.find(x=>x.id===document.querySelector('#v').value);if(!v)return null;if(v.player_id)return v.player_id;let p=d.players.find(x=>x.name.trim().toLowerCase()===v.name.trim().toLowerCase());return p?.id||null}function draw(){[['top',T],['flop',F]].forEach(([k,a])=>{let box=document.querySelector('#'+k);box.innerHTML='';let me=own();d.players.forEach(p=>{let b=document.createElement('button'),i=a.indexOf(p.id);if(me===p.id){b.className='disabled';b.disabled=true;b.textContent=p.name+' · Toi'}else{if(i>=0)b.className='sel';b.innerHTML=(i>=0?'<span class="rank">'+(i+1)+'</span>':'')+esc(p.name);b.onclick=()=>{let n=a.indexOf(p.id);if(n>=0)a.splice(n,1);else if(a.length<4)a.push(p.id);draw()}}box.appendChild(b)})});document.querySelector('#count').innerHTML='<span class="blue">🌊 Sur le Lay '+T.length+'/4</span><span class="red">🌧️ Sous le Lay '+F.length+'/4</span>';let ok=document.querySelector('#v').value&&T.length===4&&F.length===4&&new Set(T.concat(F)).size===8;document.querySelector('#send').disabled=!ok}async function submit(){let s=document.querySelector('#send'),m=document.querySelector('#msg');s.disabled=true;let b={token,voter_id:document.querySelector('#v').value};T.forEach((x,i)=>b['top_'+(i+1)]=x);F.forEach((x,i)=>b['flop_'+(i+1)]=x);try{await api(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});app.innerHTML='<div class="ok"><div class="big">🐐</div><h2>Vote enregistré !</h2><p>Le vestiaire a parlé. 😎</p></div>'}catch(e){m.className='err';m.textContent=e.message;s.disabled=false}}load();</script></body></html>
