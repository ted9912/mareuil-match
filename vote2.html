<!doctype html>
<html lang="fr" translate="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="google" content="notranslate"><title>Mareuil Match — Vote</title><style>*{box-sizing:border-box}body{margin:0;background:#06110a;color:#fff;font-family:Arial,sans-serif}main{max-width:680px;margin:auto;padding:18px}.card{background:#102017;border:1px solid #29432f;border-radius:20px;padding:18px;margin:12px 0}h1{color:#61df4c}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}button,select{width:100%;padding:14px;border-radius:12px;font-size:16px}button{border:2px solid #304237;background:#0b160f;color:#fff;font-weight:bold}.sel{border-color:#61df4c;background:#122d16}.disabled{opacity:.35;cursor:not-allowed}.flop .sel{border-color:#ef5350;background:#301515}select{background:#fff;color:#111;border:0}.send{background:#61df4c;color:#071008;border:0;margin-top:10px}.send:disabled{opacity:.4}.err{color:#ff7777;font-weight:bold}.muted{color:#aeb8b0}.counter{font-weight:bold;margin-top:8px}</style></head><body><main><div id="app" class="card">Chargement…</div></main><script>(function(){'use strict';var API='/api/vote',token=new URLSearchParams(window.location.search).get('token'),data=null,top=[],flop=[],app=document.getElementById('app');function showError(m){app.innerHTML='';var h=document.createElement('h1');h.textContent='⚽ Mareuil Match';app.appendChild(h);var p=document.createElement('p');p.className='err';p.textContent=m;app.appendChild(p)}function api(url,opt){opt=opt||{};var c=new AbortController(),t=setTimeout(function(){c.abort()},6000);opt.signal=c.signal;opt.cache='no-store';return fetch(url,opt).then(function(r){return r.text().then(function(x){var j;try{j=JSON.parse(x)}catch(e){throw new Error('Réponse invalide du serveur.')}if(!r.ok)throw new Error(j.error||'Erreur serveur.');return j})}).catch(function(e){if(e.name==='AbortError')throw new Error('Le serveur ne répond pas.');throw e}).finally(function(){clearTimeout(t)})}function load(){if(!token){showError('Lien de vote incomplet.');return}api(API+'?token='+encodeURIComponent(token)).then(function(j){data=j;render()}).catch(function(e){showError(e.message)})}function render(){app.innerHTML='';var h=document.createElement('h1');h.textContent='⚽ Mareuil Match';app.appendChild(h);var p=document.createElement('p');p.className='muted';p.textContent=data.match.opponent+' · '+new Date(data.match.match_date+'T12:00:00').toLocaleDateString('fr-FR');app.appendChild(p);var vc=document.createElement('div');vc.className='card';var s=document.createElement('select');s.id='voter';var o=document.createElement('option');o.value='';o.textContent='Choisis ton nom';s.appendChild(o);data.voters.forEach(function(v){var q=document.createElement('option');q.value=v.id;q.textContent=v.name;s.appendChild(q)});vc.appendChild(s);app.appendChild(vc);makeGroup('top','🟢 TOP','1er +4 · 2e +3 · 3e +2 · 4e +1');makeGroup('flop','🔴 FLOP','1er −4 · 2e −3 · 3e −2 · 4e −1');var bc=document.createElement('div');bc.className='card';var counter=document.createElement('p');counter.id='counter';counter.className='counter muted';bc.appendChild(counter);var send=document.createElement('button');send.id='send';send.className='send';send.textContent='Valider mon vote';bc.appendChild(send);var msg=document.createElement('p');msg.id='msg';bc.appendChild(msg);app.appendChild(bc);s.addEventListener('change',function(){top=[];flop=[];draw();check()});send.addEventListener('click',submit);draw();check()}function makeGroup(k,t,sub){var c=document.createElement('div');c.className='card '+k;var h=document.createElement('h2');h.textContent=t;c.appendChild(h);var p=document.createElement('p');p.className='muted';p.textContent=sub;c.appendChild(p);var g=document.createElement('div');g.id=k;g.className='grid';c.appendChild(g);app.appendChild(c)}function selectedVoter(){var e=document.getElementById('voter');return e&&e.value?data.voters.find(function(v){return v.id===e.value}):null}function ownPlayerId(){var v=selectedVoter();if(!v)return null;if(v.player_id)return v.player_id;var n=String(v.name||'').trim().toLowerCase();var p=data.players.find(function(x){return String(x.name||'').trim().toLowerCase()===n});return p?p.id:null}function draw(){[['top',top],['flop',flop]].forEach(function(pair){var k=pair[0],a=pair[1],box=document.getElementById(k);box.innerHTML='';var own=ownPlayerId();data.players.forEach(function(p){var b=document.createElement('button'),mine=own&&p.id===own,i=a.indexOf(p.id);if(i>=0)b.className='sel';if(mine){b.className='disabled';b.disabled=true;b.textContent=p.name+' · Toi'}else{b.textContent=p.name+(i>=0?' · '+(k==='top'?[4,3,2,1][i]:'−'+[4,3,2,1][i]):'');b.addEventListener('click',function(){var n=a.indexOf(p.id);if(n>=0)a.splice(n,1);else if(a.length<4)a.push(p.id);draw();check()})}box.appendChild(b)})})}function check(){var counter=document.getElementById('counter'),distinct=new Set(top.concat(flop)).size;if(counter)counter.textContent='TOP '+top.length+'/4 · FLOP '+flop.length+'/4'+(distinct<top.length+flop.length?' · Retire les doublons':'')}async function submit(){var voter=document.getElementById('voter'),send=document.getElementById('send'),msg=document.getElementById('msg');var distinct=new Set(top.concat(flop)).size;if(!voter.value){msg.className='err';msg.textContent='Choisis ton nom.';return}if(top.length!==4||flop.length!==4||distinct!==8){msg.className='err';msg.textContent='Il faut choisir 4 TOP et 4 FLOP, avec 8 joueurs différents.';return}if(ownPlayerId()&&top.concat(flop).indexOf(ownPlayerId())>=0){msg.className='err';msg.textContent='Tu ne peux pas voter pour toi-même.';draw();return}send.disabled=true;msg.className='muted';msg.textContent='Envoi…';var body={token:token,voter_id:voter.value};top.forEach(function(x,i){body['top_'+(i+1)]=x});flop.forEach(function(x,i){body['flop_'+(i+1)]=x});try{await api(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});app.innerHTML='<div style="text-align:center;padding:40px"><h1>✅ Vote enregistré</h1><p>Merci pour ton vote !</p></div>'}catch(e){msg.className='err';msg.textContent=e.message;send.disabled=false}}load()})();</script></body></html>
