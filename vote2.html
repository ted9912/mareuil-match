<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061827"><title>Mareuil Match — Vote</title><style>*{box-sizing:border-box}body{margin:0;color:#fff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#031827 url("/assets/mareuil-bg-high.jpg") center center/100% 100% fixed no-repeat;min-height:100vh}.shell{max-width:1050px;margin:auto;padding:8px 10px 35px}.brand{text-align:center;margin-bottom:12px}.brand h1{margin:0;font-size:25px;letter-spacing:.08em}.brand h1 span{color:#35df79}.brand p{margin:2px 0;color:#aac0cc;font-size:10px;font-style:italic}.crest{width:48px;height:58px;display:block;margin:auto;filter:drop-shadow(0 7px 14px #0007)}.match{background:rgba(6,27,42,.72);border:1px solid #23647e;border-radius:24px;padding:15px;box-shadow:0 20px 55px #0008}.eyebrow{color:#35df79;text-transform:uppercase;letter-spacing:.14em;font-size:10px;font-weight:950}.match h2{margin:3px 0;font-size:25px;color:#fff;text-shadow:0 2px 8px #000}.date{margin:0;color:#e2edf2;font-size:13px;font-weight:750;text-shadow:0 2px 6px #000}.voter{display:flex;gap:10px;align-items:center;margin-top:13px;padding:10px;background:rgba(6,26,41,.68);border:1px solid #31566a;border-radius:15px}.voter label{font-size:11px;font-weight:950;white-space:nowrap}.voter select{flex:1;padding:11px;border-radius:11px;background:#0b2536;color:#fff;border:1px solid #426778;font-size:14px;outline:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.sec{border:1px solid #159de0;border-radius:21px;padding:11px;background:rgba(7,51,76,.16);box-shadow:0 10px 28px #0003}.sec.flop{border-color:#e7444e;background:rgba(58,24,34,.16)}.head{text-align:center}.logo{width:145px;height:82px;object-fit:contain;margin:auto;display:block}.head h3{margin:0;font-size:16px;letter-spacing:.04em}.head h3 span{display:block;color:#35df79;font-size:24px;font-style:italic;line-height:1.05}.flop h3 span{color:#ff646b}.head small{display:block;margin-top:7px;color:#b6c7ce;font-size:9px;line-height:1.3;font-weight:800}.players{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}.players button{min-height:45px;padding:7px;border-radius:11px;border:1px solid #176f99;background:rgba(8,40,59,.58);color:#fff;font-size:12px;font-weight:850;text-align:left;cursor:pointer;transition:.15s}.players button:active{transform:scale(.98)}.flop .players button{border-color:#86323d;background:rgba(50,23,32,.58)}.players .sel{background:linear-gradient(90deg,#0789d1,#0a527e);border-color:#6ad9ff;box-shadow:0 0 0 1px #4bc5ef55}.flop .players .sel{background:linear-gradient(90deg,#cf303c,#70222d);border-color:#ff858a}.players .disabled{opacity:.34;text-decoration:line-through;cursor:not-allowed}.rank{display:inline-flex;width:23px;height:23px;border-radius:50%;background:#fff;color:#086d9f;align-items:center;justify-content:center;margin-right:5px;font-weight:950}.flop .rank{color:#c12630}.foot{margin-top:12px;padding:11px;background:rgba(5,23,37,.30);border:1px solid #2a6075;border-radius:18px;position:sticky;bottom:8px;box-shadow:0 14px 30px #0008}.count{display:flex;justify-content:center;gap:24px;margin:0 0 9px;font-size:12px;font-weight:950}.blue{color:#48ceff}.red{color:#ff747b}.send{width:100%;padding:14px;border:0;border-radius:13px;background:linear-gradient(90deg,#2ecb59,#70e878);color:#032012;font-size:16px;font-weight:950;cursor:pointer;box-shadow:0 7px 18px #25bf5544}.send:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}.err{color:#ff858b;font-weight:900;text-align:center}.confirm{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.confirm.show{display:flex}.confirm-box{width:min(430px,100%);background:linear-gradient(145deg,#082b40,#061b2a);border:1px solid #3b7b95;border-radius:24px;padding:22px;box-shadow:0 25px 70px #000c;text-align:center}.confirm-box h3{margin:0 0 8px;font-size:22px}.confirm-box p{color:#b9cbd2;font-size:13px;line-height:1.5;margin:0 0 18px}.confirm-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.confirm-actions button{border:0;border-radius:13px;padding:13px;font-weight:950;font-size:14px;cursor:pointer}.confirm-cancel{background:#173447;color:#fff}.confirm-ok{background:linear-gradient(90deg,#2ecb59,#70e878);color:#032012}.ok{text-align:center;padding:45px 10px}.ok .big{font-size:60px}.ok h2{font-size:28px}.ok p{color:#b8cad2}@media(max-width:700px){.shell{padding:9px 6px 25px}.brand h1{font-size:21px}.crest{width:44px;height:53px}.match{padding:10px;border-radius:19px}.match h2{font-size:22px}.grid{gap:7px}.sec{padding:7px;border-radius:17px}.logo{width:100%;height:70px}.head h3{font-size:13px}.head h3 span{font-size:18px}.head small{font-size:7.5px}.players{grid-template-columns:1fr;gap:5px}.players button{min-height:41px;font-size:11px}.count{font-size:10px;gap:10px}.voter{display:block}.voter label{display:block;margin-bottom:5px}}@media(max-width:360px){.grid{grid-template-columns:1fr}.players{grid-template-columns:1fr 1fr}.head{display:grid;grid-template-columns:82px 1fr;align-items:center;text-align:left}.logo{width:82px}.head h3 span{font-size:18px}}@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}@keyframes pickPop{0%{transform:scale(.92);box-shadow:0 0 0 0 #4bc5ef00}55%{transform:scale(1.045);box-shadow:0 0 0 5px #4bc5ef22,0 0 22px #4bc5ef55}100%{transform:scale(1);box-shadow:0 0 0 1px #4bc5ef55}}@keyframes rankIn{from{opacity:0;transform:scale(.55) rotate(-12deg)}to{opacity:1;transform:scale(1) rotate(0)}}@keyframes buttonReady{0%,100%{box-shadow:0 7px 18px #25bf5544}50%{box-shadow:0 8px 26px #25bf5577}}.match{animation:fadeUp .55s ease-out both}.sec{animation:fadeUp .5s ease-out both}.sec.flop{animation-delay:.08s}.players button{transition:transform .18s cubic-bezier(.2,.8,.2,1),background .22s,border-color .22s,box-shadow .22s}.players button:hover:not(.disabled){transform:translateY(-2px) scale(1.015);box-shadow:0 6px 14px #0005}.players button:active:not(.disabled){transform:scale(.95)}.players .sel{animation:pickPop .3s cubic-bezier(.2,.8,.2,1)}.rank{animation:rankIn .22s ease-out both}.send:not(:disabled){animation:buttonReady 1.8s ease-in-out infinite}.send:active:not(:disabled){transform:scale(.985)}.confirm.show .confirm-box{animation:fadeUp .25s ease-out both}@media(max-width:700px){.players button:hover:not(.disabled){transform:none}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.nav{position:sticky;bottom:8px;z-index:10;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:10px;padding:6px;background:rgba(3,19,31,.92);border:1px solid #2c6278;border-radius:18px;backdrop-filter:blur(10px)}
.nav a{color:#9bb9c7;text-decoration:none;text-align:center;font-size:9px;font-weight:850;padding:7px 3px;border-radius:12px}.nav a.active{color:#65e979;background:rgba(48,190,88,.12)}.nav i{display:block;font-style:normal;font-size:18px;margin-bottom:2px}
.player-card{display:flex!important;align-items:center!important;gap:8px!important;text-align:left!important;padding:7px!important}.avatar{width:42px;height:42px;min-width:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#195a7a,#092536);border:1px solid #65c7ec;color:#fff;font-size:21px;font-weight:950;overflow:hidden;box-shadow:inset 0 1px #ffffff18}.avatar img{width:100%;height:100%;object-fit:cover}.player-name{min-width:0;line-height:1.1}.player-name b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.player-name small{display:block;color:#8eafbd;font-size:9px;margin-top:3px}.sel .avatar{border-color:#8affaa;box-shadow:0 0 0 2px #52db7b44}.flop .sel .avatar{border-color:#ff969b;box-shadow:0 0 0 2px #ff4d5844}.disabled .avatar{filter:grayscale(1)}.pick-hint{margin:10px 0 0;text-align:center;color:#a7c2cd;font-size:11px}.success-icon{display:inline-grid;place-items:center;width:82px;height:82px;border-radius:50%;background:linear-gradient(145deg,#39d96a,#0e6e3a);box-shadow:0 0 35px #39d96a66;font-size:42px;animation:pickPop .55s ease-out}
</style></head><body><main class="shell"><div id="app" class="match">Chargement…</div></main><script>const API='/api/vote'; let token=new URLSearchParams(location.search).get('token'),RAW='/assets/',app=document.querySelector('#app');let d,T=[],F=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(u,o){let r=await fetch(u,o||{}),x=await r.text(),j;try{j=JSON.parse(x)}catch{throw Error('Réponse invalide du serveur.')}if(!r.ok)throw Error(j.error||'Erreur serveur.');return j}async function asset(n){let x=await fetch(RAW+n+'.b64',{cache:'no-store'});if(!x.ok)throw Error('Impossible de charger les éléments du vote.');let t=await x.text();return'data:image/webp;base64,'+t.trim()}function fail(x){app.innerHTML='<div class="ok"><div class="big">⚽</div><h2>Mareuil Match</h2><p class="err">'+esc(x)+'</p></div>'}async function load(){try{const q=token?'?token='+encodeURIComponent(token):'';d=await api(API+q);if(!token&&d.match?.public_token){token=d.match.public_token;history.replaceState(null,'','/vote.html?token='+encodeURIComponent(token))}render();Promise.all([asset('wave'),asset('rain')]).then(([w,r])=>{const a=document.querySelector('#wave'),b=document.querySelector('#rain');if(a)a.src=w;if(b)b.src=r}).catch(()=>{})}catch(e){fail(e.message)}}function render(w,r){app.innerHTML='<div class="eyebrow">MATCH DU JOUR</div><h2>'+esc(d.match.opponent)+'</h2><p class="date">'+new Date(d.match.match_date+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'</p><div class="voter"><label>QUI VOTE ?</label><select id="v"><option value="">Choisis ton nom</option>'+d.voters.map(v=>'<option value="'+v.id+'">'+esc(v.name)+'</option>').join('')+'</select></div><div class="grid"><section class="sec"><div class="head"><img id="wave" class="logo"><div><h3>MAREUILLAIS<span>SUR LE LAY</span></h3><small>🐐 LES MEILLEURS DU MATCH<br>Clique 4 fois : 1er, 2e, 3e, 4e.</small></div></div><div id="top" class="players"></div></section><section class="sec flop"><div class="head"><img id="rain" class="logo"><div><h3>MAREUILLAIS<span>SOUS LE LAY</span></h3><small>🐐 LES CHÈVRES DU MATCH<br>Clique 4 fois : 1er, 2e, 3e, 4e.</small></div></div><div id="flop" class="players"></div></section></div><p class="pick-hint">💡 Choisis 4 joueurs dans chaque catégorie, dans l'ordre.</p><div class="foot"><p id="count" class="count"><span class="blue">🌊 Sur le Lay 0/4</span><span class="red">🌧️ Sous le Lay 0/4</span></p><button id="send" class="send" disabled>➤ &nbsp; Valider mon vote</button><p id="msg"></p></div><nav class="nav"><a class="active" href="/vote.html">⚽<i>Vote</i></a><a href="/">⌂<i>Accueil</i></a><a href="/admin.html">⚙️<i>Admin</i></a><a href="/admin.html">🏆<i>Classement</i></a></nav><div id="confirm" class="confirm" role="dialog" aria-modal="true" aria-labelledby="confirmTitle"><div class="confirm-box"><h3 id="confirmTitle">Tu es sûr de tes choix ?</h3><p>Vérifie ton Top 4 et ton Flop 4. Une fois le vote envoyé, tu ne pourras plus le modifier.</p><div class="confirm-actions"><button type="button" class="confirm-cancel" id="cancelConfirm">← Modifier mes choix</button><button type="button" class="confirm-ok" id="okConfirm">✓ Confirmer mon vote</button></div></div></div>';document.querySelector('#wave').src=w;document.querySelector('#rain').src=r;document.querySelector('#v').onchange=draw;document.querySelector('#send').onclick=openConfirm;document.querySelector('#cancelConfirm').onclick=closeConfirm;document.querySelector('#okConfirm').onclick=submit;draw()}function initials(name){return String(name||'').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}function playerButton(p,i,type,me){let b=document.createElement('button');b.className='player-card'+(i>=0?' sel':'')+(me===p.id?' disabled':'');b.disabled=me===p.id;if(me===p.id){b.innerHTML='<span class="avatar">⚽</span><span class="player-name"><b>'+esc(p.name)+'</b><small>Ton vote</small></span>'}else{b.innerHTML='<span class="avatar">⚽</span><span class="player-name"><b>'+esc(p.name)+'</b>'+(i>=0?'<small>Position '+(i+1)+'</small>':'')+'</span>'}return b}function own(){let v=d.voters.find(x=>x.id===document.querySelector('#v').value);if(!v)return null;if(v.player_id)return v.player_id;let p=d.players.find(x=>x.name.trim().toLowerCase()===v.name.trim().toLowerCase());return p?.id||null}function draw(){[['top',T],['flop',F]].forEach(([k,a])=>{let box=document.querySelector('#'+k);box.innerHTML='';let me=own();d.players.forEach(p=>{let i=a.indexOf(p.id),b=playerButton(p,i,k,me);if(i>=0&&!b.disabled)b.innerHTML='<span class="rank">'+(i+1)+'</span>'+b.innerHTML;b.onclick=()=>{if(b.disabled)return;let n=a.indexOf(p.id);if(n>=0)a.splice(n,1);else if(a.length<4)a.push(p.id);draw()};box.appendChild(b)})});document.querySelector('#count').innerHTML='<span class="blue">🌊 Sur le Lay '+T.length+'/4</span><span class="red">🌧️ Sous le Lay '+F.length+'/4</span>';let ok=document.querySelector('#v').value&&T.length===4&&F.length===4&&new Set(T.concat(F)).size===8;document.querySelector('#send').disabled=!ok}function openConfirm(){if(document.querySelector('#send').disabled)return;document.querySelector('#confirm').classList.add('show')}function closeConfirm(){document.querySelector('#confirm').classList.remove('show')}async function submit(){closeConfirm();let s=document.querySelector('#send'),m=document.querySelector('#msg');s.disabled=true;let b={token,voter_id:document.querySelector('#v').value};T.forEach((x,i)=>b['top_'+(i+1)]=x);F.forEach((x,i)=>b['flop_'+(i+1)]=x);try{await api(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});app.innerHTML='<div class="ok"><div class="success-icon">✓</div><h2>Vote enregistré !</h2><p>Le vestiaire a parlé. 😎</p></div>'}catch(e){m.className='err';m.textContent=e.message;s.disabled=false}}load();</script></body></html>
