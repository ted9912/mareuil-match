<!doctype html>
<html lang="fr" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="google" content="notranslate">
<title>Mareuil Match — Vote</title>
<style>*{box-sizing:border-box}body{margin:0;background:#06110a;color:#fff;font-family:Arial,sans-serif}main{max-width:680px;margin:auto;padding:18px}.card{background:#102017;border:1px solid #29432f;border-radius:20px;padding:18px;margin:12px 0}h1{color:#61df4c}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}button,select{width:100%;padding:14px;border-radius:12px;font-size:16px}button{border:2px solid #304237;background:#0b160f;color:#fff;font-weight:bold}.sel{border-color:#61df4c;background:#122d16}.disabled{opacity:.35;cursor:not-allowed}.flop .sel{border-color:#ef5350;background:#301515}select{background:#fff;color:#111;border:0}.send{background:#61df4c;color:#071008;border:0;margin-top:10px}.send:disabled{opacity:.4}.err{color:#ff7777;font-weight:bold}.muted{color:#aeb8b0}.counter{font-weight:bold;margin-top:8px}</style>
</head>
<body><main><div id="app" class="card">Chargement…</div></main>
<script>
(function(){
'use strict';
var API='/api/vote';
var token=new URLSearchParams(window.location.search).get('token');
var data=null,top=[],flop=[];
var app=document.getElementById('app');
function showError(message){app.innerHTML='';var h=document.createElement('h1');h.textContent='⚽ Mareuil Match';app.appendChild(h);var p=document.createElement('p');p.className='err';p.textContent=message;app.appendChild(p);}
function api(url,options){options=options||{};var controller=new AbortController();var timer=setTimeout(function(){controller.abort();},6000);options.signal=controller.signal;options.cache='no-store';return fetch(url,options).then(function(r){return r.text().then(function(text){var j;try{j=JSON.parse(text);}catch(e){throw new Error('Réponse invalide du serveur.');}if(!r.ok)throw new Error(j.error||'Erreur serveur.');return j;});}).catch(function(e){if(e.name==='AbortError')throw new Error('Le serveur ne répond pas.');throw e;}).finally(function(){clearTimeout(timer);});}
function load(){if(!token){showError('Lien de vote incomplet.');return;}api(API+'?token='+encodeURIComponent(token),{}).then(function(j){data=j;render();}).catch(function(e){showError(e.message);});}
function render(){app.innerHTML='';var h=document.createElement('h1');h.textContent='⚽ Mareuil Match';app.appendChild(h);var p=document.createElement('p');p.className='muted';p.textContent=data.match.opponent+' · '+new Date(data.match.match_date+'T12:00:00').toLocaleDateString('fr-FR');app.appendChild(p);var vc=document.createElement('div');vc.className='card';var select=document.createElement('select');select.id='voter';var first=document.createElement('option');first.value='';first.textContent='Choisis ton nom';select.appendChild(first);data.voters.forEach(function(v){var o=document.createElement('option');o.value=v.id;o.textContent=v.name;select.appendChild(o);});vc.appendChild(select);app.appendChild(vc);makeGroup('top','🟢 TOP','1er +4 · 2e +3 · 3e +2 · 4e +1');makeGroup('flop','🔴 FLOP','1er −4 · 2e −3 · 3e −2 · 4e −1');var bc=document.createElement('div');bc.className='card';var counter=document.createElement('p');counter.id='counter';counter.className='counter muted';bc.appendChild(counter);var send=document.createElement('button');send.id='send';send.className='send';send.disabled=true;send.textContent='Valider mon vote';bc.appendChild(send);var msg=document.createElement('p');msg.id='msg';bc.appendChild(msg);app.appendChild(bc);select.addEventListener('change',function(){top=[];flop=[];draw();check();});send.addEventListener('click',submit);draw();check();}
function makeGroup(kind,title,subtitle){var c=document.createElement('div');c.className='card '+kind;var h=document.createElement('h2');h.textContent=title;c.appendChild(h);var p=document.createElement('p');p.className='muted';p.textContent=subtitle;c.appendChild(p);var g=document.createElement('div');g.id=kind;g.className='grid';c.appendChild(g);app.appendChild(c);}
function selectedVoter(){var el=document.getElementById('voter');if(!el||!el.value)return null;return data.voters.find(function(v){return v.id===el.value;})||null;}
function ownPlayerId(){var v=selectedVoter();return v&&v.player_id?v.player_id:null;}
function draw(){[['top',top],['flop',flop]].forEach(function(pair){var kind=pair[0],arr=pair[1],box=document.getElementById(kind);box.innerHTML='';var own=ownPlayerId();data.players.forEach(function(player){var b=document.createElement('button');var isOwn=own&&player.id===own;var i=arr.indexOf(player.id);if(i>=0)b.className='sel';if(isOwn){b.className='disabled';b.disabled=true;b.textContent=player.name+' · Toi';}else{b.textContent=player.name+(i>=0?' · '+(kind==='top'?[4,3,2,1][i]:'−'+[4,3,2,1][i]):'');b.addEventListener('click',function(){var n=arr.indexOf(player.id);if(n>=0)arr.splice(n,1);else if(arr.length<4)arr.push(player.id);draw();check();});}box.appendChild(b);});});}
function check(){var voter=document.getElementById('voter'),send=document.getElementById('send'),counter=document.getElementById('counter');var distinct=new Set(top.concat(flop)).size;if(counter)counter.textContent='TOP '+top.length+'/4 · FLOP '+flop.length+'/4';send.disabled=!(voter.value&&top.length===4&&flop.length===4&&distinct===8);}
async function submit(){var voter=document.getElementById('voter'),send=document.getElementById('send'),msg=document.getElementById('msg');if(send.disabled)return;send.disabled=true;msg.textContent='Envoi…';var body={token:token,voter_id:voter.value};top.forEach(function(x,i){body['top_'+(i+1)]=x;});flop.forEach(function(x,i){body['flop_'+(i+1)]=x;});try{await api(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});app.innerHTML='<div style="text-align:center;padding:40px"><h1>✅ Vote enregistré</h1><p>Merci pour ton vote !</p></div>';}catch(e){msg.className='err';msg.textContent=e.message;send.disabled=false;}}
load();
})();
</script></body></html>
