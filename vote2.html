<head>

<title>Mareuil Match — Vote</title>
<style>
*{box-sizing:border-box}html{background:#031522}body{margin:0;background:radial-gradient(circle at 15% 8%,#063c5a 0,#031a2b 32%,#02131f 72%,#032d2a 100%);background-attachment:fixed;color:#fff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}.shell{width:min(1180px,100%);margin:auto;padding:18px 18px 150px}.topbar{display:flex;align-items:center;justify-content:center;position:relative;padding:2px 0 20px}.brand{display:flex;align-items:center;gap:14px}.crest{width:76px;height:92px;filter:drop-shadow(0 8px 18px #0008)}.brandname{font-weight:1000;font-size:30px;letter-spacing:.035em;line-height:1}.brandname span{color:#20ec78}.tagline{font-size:15px;color:#c6d4dd;margin-top:8px;font-style:italic}.menu{position:absolute;left:0;top:14px;width:46px;height:40px;border:0;background:none;color:#fff;font-size:34px;line-height:1;cursor:pointer}.match{margin:0 0 14px;border:1px solid #087fc0;border-radius:22px;background:linear-gradient(100deg,#06283cdd,#061d30dd);padding:18px 22px;box-shadow:0 14px 35px #0005;position:relative;overflow:hidden}.match:after{content:'TOUS\A ENSEMBLE';white-space:pre;position:absolute;right:25px;top:18px;color:#6b8999;font-size:28px;font-weight:1000;font-style:italic;line-height:.85;opacity:.45;transform:rotate(-7deg)}.eyebrow{color:#39b7ff;text-transform:uppercase;letter-spacing:.14em;font-size:13px;font-weight:1000}.match h2{font-size:32px;margin:4px 0}.date{color:#aebdca;font-size:17px;margin:0}.voter{display:flex;align-items:center;gap:14px;margin:12px 0 14px;padding:10px 14px;border:1px solid #2d6079;border-radius:22px;background:#08253a}.voter label{font-size:16px;font-weight:1000;color:#b6c9d6;white-space:nowrap}.voter select{flex:1;min-width:0;padding:14px 18px;border:1px solid #315a70;background:#071d2e;color:#fff;border-radius:15px;font-size:16px;font-weight:800}.groups{display:grid;grid-template-columns:1fr 1fr;gap:18px}.section{border-radius:25px;padding:18px;background:linear-gradient(145deg,#062846f2,#031b2af2);box-shadow:0 15px 40px #0005}.section.top{border:2px solid #069eff;box-shadow:0 0 20px #069eff35,0 18px 45px #0006}.section.flop{border:2px solid #ff343b;background:linear-gradient(145deg,#31121df2,#180d17f2);box-shadow:0 0 20px #ff343b30,0 18px 45px #0006}.section-head{display:flex;align-items:center;gap:14px;min-height:105px}.logoBox{width:116px;height:100px;display:grid;place-items:center;flex:0 0 auto}.section h3{margin:0;font-size:25px;line-height:1;text-transform:uppercase;font-weight:1000}.section h3 span{display:block;font-style:italic;font-size:27px;margin-top:5px}.top h3 span{color:#21ee7b}.flop h3 span{color:#ff464a}.section small{display:block;margin-top:8px;color:#8fb5c9;font-size:12px;font-weight:900}.flop small{color:#ff9295}.players{display:grid;grid-template-columns:1fr;gap:8px;margin-top:13px}.players button{position:relative;border:1px solid #087fc0;background:#06243a;color:#f4fbff;min-height:49px;border-radius:14px;padding:10px 12px;font-weight:800;font-size:15px;transition:.15s;cursor:pointer;text-align:left}.flop .players button{border-color:#a63b45;background:#32151f}.players button.sel{background:#087fca;border-color:#69d0ff;box-shadow:0 0 0 2px #69d0ff33}.flop .players button.sel{background:#c72c38;border-color:#ff8a8e;box-shadow:0 0 0 2px #ff8a8e33}.players button.disabled{opacity:.32;text-decoration:line-through;cursor:not-allowed}.rank{display:inline-flex;align-items:center;justify-content:center;width:29px;height:29px;border-radius:50%;background:#fff;color:#0877b8;margin-right:8px;font-size:14px;font-weight:1000}.flop .rank{color:#c5232e}.footer{position:sticky;bottom:12px;z-index:5;margin:18px auto 0;width:min(960px,100%);background:#041b2aec;backdrop-filter:blur(18px);padding:13px 16px 15px;border-radius:23px;border:1px solid #1c4d65;box-shadow:0 -5px 35px #0007}.counter{display:flex;justify-content:center;gap:30px;text-align:center;color:#b1c3cf;font-weight:900;font-size:15px;margin:0 0 10px}.send{width:100%;border:0;border-radius:17px;padding:17px;background:linear-gradient(90deg,#2ecb54,#65e36a);color:#031208;font-size:19px;font-weight:1000;box-shadow:0 8px 24px #25c94b44}.send:disabled{opacity:.45}.err{color:#ff7777;font-weight:900;text-align:center}.success{text-align:center;padding:70px 15px}.success .big{font-size:60px}.success h2{font-size:30px}.muted{color:#9db0bd}.bottomnav{display:flex;justify-content:space-around;align-items:center;margin-top:20px;padding:17px 10px;border:1px solid #24495d;border-radius:25px;background:#031a2aee;color:#b9c9d5}.navitem{text-align:center;font-weight:900;font-size:13px}.navicon{display:block;font-size:25px;margin-bottom:3px}.navitem.active{color:#28ed7b}.navitem.active .navicon{filter:drop-shadow(0 0 8px #28ed7b)}
@media(max-width:760px){.shell{padding:10px 14px 145px}.topbar{padding-bottom:15px}.brand{gap:10px}.crest{width:55px;height:70px}.brandname{font-size:25px}.tagline{font-size:12px}.menu{left:-2px;top:7px}.match{padding:16px 18px}.match:after{display:none}.match h2{font-size:28px}.voter{display:block;padding:13px 14px}.voter label{display:block;margin:0 0 7px}.voter select{width:100%}.groups{grid-template-columns:1fr;gap:14px}.section{padding:15px;border-radius:23px}.section-head{min-height:92px}.logoBox{width:88px;height:88px}.section h3{font-size:21px}.section h3 span{font-size:24px}.section small{font-size:11px}.players button{font-size:14px;min-height:51px}.bottomnav{display:none}}
@media(min-width:761px){.players{grid-template-columns:1fr 1fr}.section small{max-width:330px}}
</style>
</head>
<body><main class="shell">
<header class="topbar"><button class="menu" aria-label="Menu">☰</button><div class="brand"><svg class="crest" viewBox="0 0 90 110" aria-label="Mareuil"><path d="M8 5h74v55c0 25-15 39-37 45C23 99 8 85 8 60Z" fill="#fff" stroke="#fff" stroke-width="4"/><path d="M12 10h66v49c0 20-12 32-33 39C24 91 12 79 12 59Z" fill="#eef7f5"/><path d="M15 57h60v11H15z" fill="#0a78bf"/><path d="M15 68h60v11H15z" fill="#25b75a"/><circle cx="45" cy="39" r="14" fill="#fff" stroke="#0b2233" stroke-width="4"/><path d="M37 39h16M45 31v16" stroke="#0b2233" stroke-width="3"/><text x="45" y="22" text-anchor="middle" font-size="10" font-weight="1000" fill="#10293a">MAREUIL</text><text x="45" y="96" text-anchor="middle" font-size="9" font-weight="1000" fill="#10293a">1971</text></svg><div><div class="brandname">MAREUIL <span>MATCH</span></div><div class="tagline">Plus qu’un club, une équipe !</div></div></div></header>
<div id="app">Chargement…</div>
</main>
<script>(function(){'use strict';var API='/api/vote',token=new URLSearchParams(location.search).get('token'),data=null,top=[],flop=[],app=document.getElementById('app');function esc(s){return String(s??'').replace(/[&<>\"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'})[c]})}function showError(m){app.innerHTML='<div class="match"><div class="success"><div class="big">⚽</div><h2>Mareuil Match</h2><p class="err">'+esc(m)+'</p></div></div>'}function api(url,opt){opt=opt||{};var c=new AbortController(),t=setTimeout(function(){c.abort()},6000);opt.signal=c.signal;opt.cache='no-store';return fetch(url,opt).then(function(r){return r.text().then(function(x){var j;try{j=JSON.parse(x)}catch(e){throw new Error('Réponse invalide du serveur.')}if(!r.ok)throw new Error(j.error||'Erreur serveur.');return j})}).catch(function(e){if(e.name==='AbortError')throw new Error('Le serveur ne répond pas.');throw e}).finally(function(){clearTimeout(t)})}function load(){if(!token){showError('Lien de vote incomplet.');return}api(API+'?token='+encodeURIComponent(token)).then(function(j){data=j;render()}).catch(function(e){showError(e.message)})}function wave(){return '<svg width="112" height="96" viewBox="0 0 140 110" fill="none"><path d="M7 72C28 30 49 91 70 53s39 35 62-11" stroke="#0aa5ff" stroke-width="13" stroke-linecap="round"/><path d="M15 88c23-18 45 16 67-5 18-18 34 10 50-7" stroke="#55d5ff" stroke-width="8" stroke-linecap="round"/><path d="M8 99c23-9 43 8 62-2 20-10 37 4 61-4" stroke="#147bc0" stroke-width="5" stroke-linecap="round"/></svg>'}function rain(){return '<svg width="112" height="96" viewBox="0 0 140 110" fill="none"><path d="M30 58h79c10 0 18-7 18-16 0-12-10-20-23-19-7-14-27-17-39-3-14-3-30 7-30 21 0 7-2 11-5 17Z" fill="#8095a4"/><path d="M43 70l-7 20M70 70l-7 20M97 70l-7 20" stroke="#ff3e47" stroke-width="8" stroke-linecap="round"/></svg>'}function render(){app.innerHTML='';var m=document.createElement('section');m.className='match';m.innerHTML='<div class="eyebrow">MATCH DU JOUR</div><h2>'+esc(data.match.opponent)+'</h2><p class="date">'+new Date(data.match.match_date+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'</p>';app.appendChild(m);var vc=document.createElement('div');vc.className='voter';vc.innerHTML='<label>QUI VOTE ?</label><select id="voter"><option value="">Choisis ton nom</option>'+data.voters.map(function(v){return '<option value="'+esc(v.id)+'">'+esc(v.name)+'</option>'}).join('')+'</select>';app.appendChild(vc);var wrap=document.createElement('div');wrap.className='groups';app.appendChild(wrap);makeGroup(wrap,'top','MAREUILLAIS','SUR LE LAY','Ceux qui ont régalé','Clique sur 4 joueurs (1er, 2e, 3e, 4e)',wave());makeGroup(wrap,'flop','MAREUILLAIS','SOUS LE LAY','Ceux qui ont un peu moins régalé','Clique sur 4 joueurs (1er, 2e, 3e, 4e)',rain());var f=document.createElement('div');f.className='footer';f.innerHTML='<p id="counter" class="counter"><span>🌊 Sur le Lay 0/4</span><span>🌧️ Sous le Lay 0/4</span></p><button id="send" class="send">➤ &nbsp; Valider mon vote</button><p id="msg"></p>';app.appendChild(f);document.getElementById('voter').addEventListener('change',function(){top=[];flop=[];draw();check()});document.getElementById('send').addEventListener('click',submit);draw();check()}function makeGroup(w,k,a,b,sub,instr,icon){var c=document.createElement('section');c.className='section '+k;var hd=document.createElement('div');hd.className='section-head';var ic=document.createElement('div');ic.className='logoBox';ic.innerHTML=icon;hd.appendChild(ic);var tx=document.createElement('div');tx.innerHTML='<h3>'+a+'<span>'+b+'</span></h3><small>'+sub+'<br>'+instr+'</small>';hd.appendChild(tx);c.appendChild(hd);var g=document.createElement('div');g.id=k;g.className='players';c.appendChild(g);w.appendChild(c)}function selectedVoter(){var e=document.getElementById('voter');return e&&e.value?data.voters.find(function(v){return v.id===e.value}):null}function ownPlayerId(){var v=selectedVoter();if(!v)return null;if(v.player_id)return v.player_id;var n=String(v.name||'').trim().toLowerCase();var p=data.players.find(function(x){return String(x.name||'').trim().toLowerCase()===n});return p?p.id:null}function draw(){[['top',top],['flop',flop]].forEach(function(pair){var k=pair[0],a=pair[1],box=document.getElementById(k);box.innerHTML='';var own=ownPlayerId();data.players.forEach(function(p){var b=document.createElement('button'),mine=own&&p.id===own,i=a.indexOf(p.id);if(i>=0)b.className='sel';if(mine){b.className='disabled';b.disabled=true;b.textContent=p.name+' · Toi'}else{var pos=i>=0?i+1:0;b.innerHTML=(pos?'<span class="rank">'+pos+'</span>':'')+esc(p.name);b.addEventListener('click',function(){var n=a.indexOf(p.id);if(n>=0)a.splice(n,1);else if(a.length<4)a.push(p.id);draw();check()})}box.appendChild(b)})})}function check(){var counter=document.getElementById('counter'),distinct=new Set(top.concat(flop)).size;if(counter)counter.innerHTML='<span>🌊 Sur le Lay <b>'+top.length+'/4</b></span><span>🌧️ Sous le Lay <b>'+flop.length+'/4</b></span>'+(distinct<top.length+flop.length?'<span class="err">Un joueur ne peut être dans les deux</span>':'')}async function submit(){var voter=document.getElementById('voter'),send=document.getElementById('send'),msg=document.getElementById('msg'),distinct=new Set(top.concat(flop)).size;if(!voter.value){msg.className='err';msg.textContent='Choisis ton nom.';return}if(top.length!==4||flop.length!==4||distinct!==8){msg.className='err';msg.textContent='Choisis 4 joueurs dans chaque catégorie, sans doublon.';return}send.disabled=true;msg.className='muted';msg.textContent='Envoi du vote…';var body={token:token,voter_id:voter.value};top.forEach(function(x,i){body['top_'+(i+1)]=x});flop.forEach(function(x,i){body['flop_'+(i+1)]=x});try{await api(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});app.innerHTML='<div class="match"><div class="success"><div class="big">🌊</div><h2>Vote enregistré !</h2><p class="muted">Merci pour ton vote. Rendez-vous au prochain match !</p></div></div>'}catch(e){msg.className='err';msg.textContent=e.message;send.disabled=false}}load()})();</script>
</body></html>
