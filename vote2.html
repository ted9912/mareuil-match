<!doctype html><html lang="fr" translate="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="google" content="notranslate"><meta name="theme-color" content="#061827"><title>Mareuil Match — Vote</title><style>*{box-sizing:border-box}html{background:#061827}body{margin:0;min-height:100vh;color:#fff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 50% -10%,#123e59,#071c2d 40%,#03121f 80%);overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.1;background:repeating-linear-gradient(160deg,transparent 0 55px,#fff 56px 57px,transparent 58px 110px)}main{max-width:980px;margin:auto;padding:16px 12px 34px;position:relative}.brand{display:flex;align-items:center;justify-content:center;gap:15px;padding:3px 0 16px}.mark{width:62px;height:72px;flex:none;background:linear-gradient(#fff 0 20%,#f5f8f8 20% 24%,#126c9d 24%);clip-path:polygon(8% 0,92% 0,92% 70%,50% 100%,8% 70%);display:grid;place-items:center;color:#071a2b;font-weight:950;font-size:15px;position:relative;box-shadow:0 8px 25px #0008}.mark:after{content:"⚽";position:absolute;font-size:25px;top:25px}.hero-copy h1{margin:0;font-size:29px;letter-spacing:.03em}.hero-copy h1 span{color:#31e47a}.hero-copy p{margin:2px 0;color:#a9bfcc;font-size:13px}.match{background:linear-gradient(105deg,#08283d,#0b2232 65%,#103b34);border:1px solid #1387c8;border-radius:22px;padding:17px 19px;box-shadow:0 16px 40px #0007;position:relative}.match:after{content:"TOUS ENSEMBLE !";position:absolute;right:18px;top:14px;color:#d9e8ee;font-size:21px;font-weight:950;font-style:italic;transform:rotate(-6deg)}.eyebrow{text-transform:uppercase;letter-spacing:.12em;color:#25c9ff;font-size:12px;font-weight:950}.match h2{margin:3px 0;font-size:29px}.date{color:#a9c7d7;margin:0}.voter{margin-top:16px;display:flex;align-items:center;gap:12px;background:#0b2536;border:1px solid #1c7ead;border-radius:19px;padding:9px 13px}.voter label{font-size:16px;font-weight:900;color:#b8cfdd;white-space:nowrap}.voter select{flex:1;min-width:0;padding:13px 15px;border:1px solid #335d73;background:#081c2a;color:#fff;border-radius:13px;font-size:16px;font-weight:750}.vote-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.section{margin-top:15px;background:#061d2e;border-radius:25px;padding:14px;border:2px solid #0798ef;box-shadow:0 0 22px #008cff35}.section.flop{border-color:#ff343d;box-shadow:0 0 22px #ff273535}.section-head{display:flex;align-items:center;gap:10px;padding:3px 5px 12px;min-height:105px}.icon{width:92px;height:92px;flex:none;display:grid;place-items:center}.icon svg{width:100%;height:100%;filter:drop-shadow(0 7px 9px #0008)}.section h3{margin:0;font-size:24px;line-height:1.02}.section h3 .accent{display:block;font-size:27px;font-style:italic;font-weight:950}.top h3 .accent{color:#27e77b}.flop h3 .accent{color:#ff4147}.section small{display:block;color:#d5e2e8;margin-top:4px;font-size:11px;font-weight:850}.flop small{color:#ffe1e1}.players{display:grid;grid-template-columns:1fr 1fr;gap:8px}.players button{border:1px solid #087db8;background:#08263a;color:#f7fbff;min-height:53px;border-radius:13px;padding:8px 11px;font-weight:800;font-size:15px;text-align:left;transition:.14s;cursor:pointer;display:flex;align-items:center}.players button.sel{background:linear-gradient(90deg,#087cc0,#0d4d78);border-color:#38c8ff;box-shadow:0 0 0 2px #38c8ff2b}.flop .players button{border-color:#a9363d;background:#301820}.flop .players button.sel{background:linear-gradient(90deg,#c72f38,#5b2028);border-color:#ff7378}.players button.disabled{opacity:.3;text-decoration:line-through;cursor:not-allowed}.rank{display:inline-flex;align-items:center;justify-content:center;width:29px;height:29px;border-radius:50%;background:#fff;color:#086ca4;margin-right:9px;font-size:13px;font-weight:950;flex:none}.flop .rank{color:#c5252d}.footer{position:sticky;bottom:10px;margin-top:16px;background:#061a29f2;backdrop-filter:blur(15px);padding:12px;border-radius:22px;border:1px solid #1e6380;box-shadow:0 -12px 35px #0007;z-index:5}.counter{display:flex;justify-content:center;gap:30px;color:#d7e5eb;font-weight:900;font-size:15px;margin:0 0 9px}.counter .blue{color:#19c9ff}.counter .red{color:#ff4d54}.send{width:100%;border:0;border-radius:15px;padding:17px;background:linear-gradient(90deg,#2dcc56,#68e86e);color:#06150b;font-size:18px;font-weight:950;box-shadow:0 7px 20px #18a53e55}.send:disabled{opacity:.45}.err{color:#ff7777;font-weight:800;text-align:center}.success{text-align:center;padding:38px 12px}.success .big{font-size:52px}.success h2{font-size:26px}.muted{color:#9db0bd}@media(max-width:700px){main{padding:12px 9px 28px}.brand{gap:10px}.mark{width:55px;height:65px}.hero-copy h1{font-size:23px}.hero-copy p{font-size:11px}.match:after{display:none}.match{padding:15px}.voter{display:block}.voter label{display:block;margin-bottom:7px}.vote-grid{grid-template-columns:1fr}.section{padding:12px}.section-head{min-height:86px}.icon{width:76px;height:76px}.section h3{font-size:19px}.section h3 .accent{font-size:21px}.section small{font-size:10px}.players{grid-template-columns:1fr}.players button{min-height:51px}.counter{gap:15px;font-size:13px}}@media(min-width:701px){.players{grid-template-columns:1fr 1fr}}</style></head><body><main><div class="brand"><div class="mark">MM</div><div class="hero-copy"><h1>MAREUIL <span>MATCH</span></h1><p>Plus qu'un club, une équipe !</p></div></div><div id="app" class="match">Chargement…</div></main><script>(function(){'use strict';var API='/api/vote',token=new URLSearchParams(location.search).get('token'),data=null,top=[],flop=[],app=document.getElementById('app');function esc(s){return String(s??'').replace(/[&<>\"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'})[c]})}function showError(m){app.innerHTML='<div class="success"><div class="big">⚽</div><h2>Mareuil Match</h2><p class="err">'+esc(m)+'</p></div>'}function api(url,opt){opt=opt||{};var c=new AbortController(),t=setTimeout(function(){c.abort()},6000);opt.signal=c.signal;opt.cache='no-store';return fetch(url,opt).then(function(r){return r.text().then(function(x){var j;try{j=JSON.parse(x)}catch(e){throw new Error('Réponse invalide du serveur.')}if(!r.ok)throw new Error(j.error||'Erreur serveur.');return j})}).catch(function(e){if(e.name==='AbortError')throw new Error('Le serveur ne répond pas.');throw e}).finally(function(){clearTimeout(t)})}function load(){if(!token){showError('Lien de vote incomplet.');return}api(API+'?token='+encodeURIComponent(token)).then(function(j){data=j;render()}).catch(function(e){showError(e.message)})}function svgWave(){return '<svg viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg"><path d="M7 70C25 37 38 72 55 46s30 24 58-10" fill="none" stroke="#0788df" stroke-width="9" stroke-linecap="round"/><path d="M10 77c19-13 34 13 54-3s31 9 48-5" fill="none" stroke="#39c8ff" stroke-width="6" stroke-linecap="round"/><path d="M24 84c17-7 29 7 45-3s25 6 38-2" fill="none" stroke="#bdeeff" stroke-width="3" stroke-linecap="round"/><path d="M71 20c7-12 22-12 28-2 11-4 22 4 20 15-2 9-11 13-20 12H70c-14 0-20-17-9-25 3-2 6-3 10 0Z" fill="#fff"/><path d="M80 18c4-5 12-5 16 1" fill="none" stroke="#0a7fd1" stroke-width="4" stroke-linecap="round"/></svg>'}function svgRain(){return '<svg viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg"><path d="M25 53h67c9 0 16-7 16-15 0-12-12-20-23-17-7-13-27-16-39-3-13-3-27 6-27 20 0 7 2 11 6 15Z" fill="#7d91a0" stroke="#d8e2e8" stroke-width="3"/><path d="M38 61l-5 18M59 61l-5 18M80 61l-5 18" stroke="#ff4148" stroke-width="7" stroke-linecap="round"/><path d="M47 59l-5 18M69 59l-5 18" stroke="#ff777c" stroke-width="3" stroke-linecap="round"/></svg>'}function render(){app.innerHTML='';var e=document.createElement('div');e.className='eyebrow';e.textContent='MATCH DU JOUR';app.appendChild(e);var h=document.createElement('h2');h.textContent=data.match.opponent;app.appendChild(h);var p=document.createElement('p');p.className='date';p.textContent=new Date(data.match.match_date+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});app.appendChild(p);var vc=document.createElement('div');vc.className='voter';vc.innerHTML='<label>QUI VOTE ?</label><select id="voter"><option value="">Choisis ton nom</option>'+data.voters.map(function(v){return '<option value="'+esc(v.id)+'">'+esc(v.name)+'</option>'}).join('')+'</select>';app.appendChild(vc);var grid=document.createElement('div');grid.className='vote-grid';app.appendChild(grid);makeGroup(grid,'top','MAREUILLAIS','SUR LE LAY','Ceux qui ont régalé','Clique sur 4 joueurs (1er, 2e, 3e, 4e).',svgWave());makeGroup(grid,'flop','MAREUILLAIS','SOUS LE LAY','Ceux qui ont un peu moins régalé','Clique sur 4 joueurs (1er, 2e, 3e, 4e).',svgRain());var f=document.createElement('div');f.className='footer';f.innerHTML='<p id="counter" class="counter"><span class="blue">🌊 Sur le Lay 0/4</span><span class="red">🌧️ Sous le Lay 0/4</span></p><button id="send" class="send">➤ &nbsp; Valider mon vote</button><p id="msg"></p>';app.appendChild(f);document.getElementById('voter').addEventListener('change',function(){top=[];flop=[];draw();check()});document.getElementById('send').addEventListener('click',submit);draw();check()}function makeGroup(parent,k,t,a,sub,instr,icon){var c=document.createElement('div');c.className='section '+k;var hd=document.createElement('div');hd.className='section-head';var ic=document.createElement('div');ic.className='icon';ic.innerHTML=icon;hd.appendChild(ic);var tx=document.createElement('div');tx.innerHTML='<h3>'+t+'<span class="accent">'+a+'</span></h3><small>'+sub+'<br>'+instr+'</small>';hd.appendChild(tx);c.appendChild(hd);var g=document.createElement('div');g.id=k;g.className='players';c.appendChild(g);parent.appendChild(c)}function selectedVoter(){var e=document.getElementById('voter');return e&&e.value?data.voters.find(function(v){return v.id===e.value}):null}function ownPlayerId(){var v=selectedVoter();if(!v)return null;if(v.player_id)return v.player_id;var n=String(v.name||'').trim().toLowerCase();var p=data.players.find(function(x){return String(x.name||'').trim().toLowerCase()===n});return p?p.id:null}function draw(){[['top',top],['flop',flop]].forEach(function(pair){var k=pair[0],a=pair[1],box=document.getElementById(k);box.innerHTML='';var own=ownPlayerId();data.players.forEach(function(p){var b=document.createElement('button'),mine=own&&p.id===own,i=a.indexOf(p.id);if(i>=0)b.className='sel';if(mine){b.className='disabled';b.disabled=true;b.textContent=p.name+' · Toi'}else{var pos=i>=0?i+1:0;b.innerHTML=(pos?'<span class="rank">'+pos+'</span>':'')+esc(p.name);b.addEventListener('click',function(){var n=a.indexOf(p.id);if(n>=0)a.splice(n,1);else if(a.length<4)a.push(p.id);draw();check()})}box.appendChild(b)})})}function check(){var c=document.getElementById('counter'),d=new Set(top.concat(flop)).size;if(c)c.innerHTML='<span class="blue">🌊 Sur le Lay '+top.length+'/4</span><span class="red">🌧️ Sous le Lay '+flop.length+'/4</span>'+(d<top.length+flop.length?' <span class="err">· Un joueur ne peut être dans les deux</span>':'')}async function submit(){var voter=document.getElementById('voter'),send=document.getElementById('send'),msg=document.getElementById('msg'),distinct=new Set(top.concat(flop)).size;if(!voter.value){msg.className='err';msg.textContent='Choisis ton nom.';return}if(top.length!==4||flop.length!==4||distinct!==8){msg.className='err';msg.textContent='Choisis 4 joueurs dans chaque catégorie, sans doublon.';return}send.disabled=true;msg.className='muted';msg.textContent='Envoi du vote…';var body={token:token,voter_id:voter.value};top.forEach(function(x,i){body['top_'+(i+1)]=x});flop.forEach(function(x,i){body['flop_'+(i+1)]=x});try{await api(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});app.innerHTML='<div class="success"><div class="big">🌊</div><h2>Vote enregistré !</h2><p class="muted">Merci pour ton vote. Rendez-vous au prochain match !</p></div>'}catch(e){msg.className='err';msg.textContent=e.message;send.disabled=false}}load()})();</script></body></html>
