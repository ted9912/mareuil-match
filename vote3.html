<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mareuil Match — Vote</title><style>html,body{margin:0;width:100%;height:100%;background:#03131f}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="app" title="Mareuil Match"></iframe><script>const token=new URLSearchParams(location.search).get('token');const frame=document.getElementById('app');fetch('/vote2.html').then(r=>r.text()).then(html=>{html=html.replace(/<svg class="crest"[\s\S]*?<\/svg>/,'<img class="crest" src="/assets/mareuil-goat-chevre.svg" alt="Mareuil GOAT CHÈVRE">');html=html.replace('MAREUILLAIS<span>SUR LE LAY</span>','MAREUIL<span>SUR LE LAY · GOAT</span>');html=html.replace('MAREUILLAIS<span>SOUS LE LAY</span>','MAREUIL<span>SOUS LE LAY · CHÈVRE</span>');html=html.replace('🌊 Sur le Lay','🐐 GOAT · Sur le Lay').replace('🌧️ Sous le Lay','🐐 CHÈVRE · Sous le Lay');const blob=new Blob([html],{type:'text/html'});frame.src=URL.createObjectURL(blob);if(token) frame.onload=()=>{try{frame.contentWindow.history.replaceState(null,'','?token='+encodeURIComponent(token))}catch(e){}}}).catch(()=>{frame.src='/vote2.html'+(token?'?token='+encodeURIComponent(token):'')})</script></body></html>
