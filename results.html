<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061827"><title>Résultats — Mareuil Match</title><style>*{box-sizing:border-box}body{margin:0;color:#fff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#031827 url("/assets/mareuil-bg-high.jpg") center/cover fixed no-repeat;min-height:100vh}main{max-width:850px;margin:auto;padding:16px 10px 40px}.brand{text-align:center}.crest{width:76px;height:92px;object-fit:contain;display:block;margin:auto}.brand h1{margin:0;font-size:23px;letter-spacing:.08em}.brand h1 span{color:#35df79}.brand p{margin:2px 0;color:#aac0cc;font-size:10px;font-style:italic}.match{margin-top:14px;background:rgba(6,27,42,.76);backdrop-filter:blur(3px);border:1px solid #23647e;border-radius:24px;padding:16px;box-shadow:0 20px 55px #0008}.eyebrow{color:#35df79;text-transform:uppercase;letter-spacing:.14em;font-size:10px;font-weight:950}.match h2{margin:4px 0;font-size:28px}.date{margin:0;color:#a9c0ca}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:15px}.stat{background:#061a29;border:1px solid #2c596e;border-radius:15px;padding:13px;text-align:center}.stat b{display:block;font-size:22px}.stat span{font-size:10px;color:#91a9b5;text-transform:uppercase;font-weight:900}.remaining{margin-top:10px;padding:12px 14px;background:#09271f;border:1px solid #2d7050;border-radius:15px;color:#d6f1df;font-size:12px}.remaining b{display:block;margin-bottom:4px}.podium{display:grid;grid-template-columns:1fr 1.1fr 1fr;align-items:end;gap:8px;margin:18px 0}.pod{background:#102f40;border:1px solid #315568;border-radius:18px;padding:14px 7px;text-align:center}.pod.first{padding-top:22px;padding-bottom:22px;border-color:#42d876}.pod .medal{font-size:25px}.pod .name{font-weight:950;font-size:14px;margin:6px 0;word-break:break-word}.pod .points{font-size:20px;font-weight:950;color:#68df78}.results{background:#071c2b;border:1px solid #294b5d;border-radius:22px;padding:15px}.results h3{margin:2px 2px 10px;font-size:18px}.item{display:grid;grid-template-columns:42px 1fr auto;gap:9px;align-items:center;border-top:1px solid #234354;padding:12px 2px}.rank{font-weight:950;color:#9db0bd;font-size:18px;text-align:center}.player{font-weight:900}.details{font-size:10px;color:#8fa6b5;margin-top:3px}.top{color:#62db76}.flop{color:#ff858c}.pts{text-align:right;font-weight:950;font-size:18px}.muted{color:#8096a3}.err{color:#ff858c;font-weight:800;text-align:center}@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}.match{animation:fadeUp .5s ease-out both}.pod{animation:fadeUp .45s ease-out both}.results{animation:fadeUp .55s ease-out both}.item{transition:transform .18s ease,background .18s ease}.item:hover{transform:translateX(3px);background:#0b2535}.back{display:block;text-align:center;color:#a9c2cf;text-decoration:none;margin-top:18px;font-weight:800}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}@media(max-width:440px){main{padding:10px 7px 30px}.match{padding:11px;border-radius:19px}.match h2{font-size:24px}.crest{width:64px;height:78px}.pod .name{font-size:12px}.item{grid-template-columns:32px 1fr auto}.pts{font-size:16px}}</style></head><body><main><header class="brand"><img class="crest" src="/assets/mareuil-goat-chevre.svg" alt="Mareuil GOAT CHÈVRE"><h1>MAREUIL <span>MATCH</span></h1><p>Le vestiaire a parlé.</p></header><div id="app" class="match">Chargement…</div></main><script>(async()=>{const token=new URLSearchParams(location.search).get('token'),app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'})[c]);if(!token){app.innerHTML='<p class="err">Lien incomplet.</p>';return}try{const r=await fetch('/api/vote?token='+encodeURIComponent(token),{cache:'no-store'}),m=await r.json();if(!r.ok)throw Error(m.error||'Erreur');const h={'apikey':'sb_publishable_LkQYS2DPXHlsgM0brO_84g_Z4KEdWwy','Authorization':'Bearer sb_publishable_LkQYS2DPXHlsgM0brO_84g_Z4KEdWwy'},base='https://hikwcryqqixqjmckhxyh.supabase.co/rest/v1/';const rr=await fetch(base+'match_player_results?match_id=eq.'+m.match.id+'&order=ranking.asc',{headers:h}),a=await rr.json();const sr=await fetch(base+'match_voter_status?match_id=eq.'+m.match.id+'&select=voter_id,name,has_voted',{headers:h}),status=await sr.json();if(!sr.ok)throw Error(status.message||status.error||'Impossible de récupérer les votants');const voters=Array.isArray(status)?status:[],voted=voters.filter(v=>v.has_voted),remaining=voters.filter(v=>!v.has_voted);let html='<div class="eyebrow">RÉSULTATS DU MATCH</div><h2>'+esc(m.match.opponent)+'</h2><p class="date">'+new Date(m.match.match_date+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'</p><div class="stats"><div class="stat"><b>'+voted.length+'/'+voters.length+'</b><span>votants</span></div><div class="stat"><b>'+a.length+'</b><span>joueurs classés</span></div></div>'+(remaining.length?'<div class="remaining"><b>👤 Restent à voter</b>'+remaining.map(v=>esc(v.name)).join(' · ')+'</div>':'<div class="remaining">✅ Tous les votants ont participé</div>');if(a.length){const p=[a[1],a[0],a[2]].filter(Boolean);html+='<div class="podium">'+p.map(x=>'<div class="pod '+(x===a[0]?'first':'')+'"><div class="medal">'+(x===a[0]?'🥇':x===a[1]?'🥈':'🥉')+'</div><div class="name">'+esc(x.player_name)+'</div><div class="points">'+x.total_points+' pts</div></div>').join('')+'</div>'}html+='<div class="results"><h3>Classement complet</h3>'+(a.map(x=>'<div class="item"><div class="rank">'+x.ranking+'</div><div><div class="player">'+esc(x.player_name)+'</div><div class="details"><span class="top">🌊 SUR LE LAY '+x.top_points+' pts · '+x.top_voters+' vot.</span> · <span class="flop">🌧️ SOUS LE LAY '+x.flop_points+' pts · '+x.flop_voters+' vot.</span></div></div><div class="pts">'+x.total_points+' pts</div></div>').join('')||'<p class="muted">Aucun résultat.</p>')+'</div><a class="back" href="/">← Mareuil Match</a>';app.innerHTML=html}catch(e){app.innerHTML='<p class="err">'+esc(e.message)+'</p>'}})()</script></body></html>
