<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Résultats — Mareuil Match</title><style>*{box-sizing:border-box}body{margin:0;background:#06110a;color:#fff;font-family:Arial,sans-serif}main{max-width:760px;margin:auto;padding:18px}h1,h2{color:#61df4c}.card{background:#102017;border:1px solid #29432f;border-radius:20px;padding:18px;margin:12px 0}.item{display:flex;justify-content:space-between;gap:12px;border-top:1px solid #29432f;padding:13px 0}.pts{font-weight:800}.muted{color:#aeb8b0}.top{color:#61df4c}.flop{color:#ff7777}.summary{font-weight:700;margin:8px 0 10px}.remaining{background:#18291e;border-radius:12px;padding:12px;margin:8px 0 16px}.remaining b{display:block;margin-bottom:6px}.names{line-height:1.6}</style></head><body><main><h1>⚽ Mareuil Match</h1><div id="app" class="card">Chargement…</div></main><script>(async()=>{const token=new URLSearchParams(location.search).get('token'),app=document.getElementById('app');if(!token){app.textContent='Lien incomplet.';return}try{const r=await fetch('/api/vote?token='+encodeURIComponent(token),{cache:'no-store'}),m=await r.json();if(!r.ok)throw Error(m.error||'Erreur');const h={'apikey':'sb_publishable_LkQYS2DPXHlsgM0brO_84g_Z4KEdWwy','Authorization':'Bearer sb_publishable_LkQYS2DPXHlsgM0brO_84g_Z4KEdWwy'},base='https://hikwcryqqixqjmckhxyh.supabase.co/rest/v1/';const rr=await fetch(base+'match_player_results?match_id=eq.'+m.match.id+'&order=ranking.asc',{headers:h}),a=await rr.json();const vr=await fetch(base+'match_votes?match_id=eq.'+m.match.id+'&select=id,voter_id',{headers:h}),votes=await vr.json();const mr=await fetch(base+'match_voters?match_id=eq.'+m.match.id+'&select=voter_id',{headers:h}),assigned=await mr.json();const ids=[...new Set((Array.isArray(assigned)?assigned:[]).map(x=>x.voter_id))];let voters=[];if(ids.length){const nr=await fetch(base+'voters?id=in.('+ids.join(',')+')&select=id,name',{headers:h});voters=await nr.json()}const votedIds=new Set((Array.isArray(votes)?votes:[]).map(x=>x.voter_id));const remaining=(Array.isArray(voters)?voters:[]).filter(v=>!votedIds.has(v.id));const voterCount=Array.isArray(votes)?votes.length:0;const totalVoters=Array.isArray(voters)?voters.length:0;app.innerHTML='<h2>'+m.match.opponent+'</h2><p class="muted">'+new Date(m.match.match_date+'T12:00:00').toLocaleDateString('fr-FR')+'</p><p class="summary">🗳️ '+voterCount+' votant'+(voterCount>1?'s':'')+' ont voté · '+remaining.length+' votant'+(remaining.length>1?'s':'')+' restant'+(remaining.length>1?'s':'')+'</p>'+(remaining.length?'<div class="remaining"><b>👤 Restent à voter :</b><div class="names">'+remaining.map(v=>v.name).join(' · ')+'</div></div>':'<div class="remaining">✅ Tout le monde a voté ! ('+totalVoters+' votant'+(totalVoters>1?'s':'')+')</div>')+a.map(x=>'<div class="item"><span><b>'+x.ranking+'. '+x.player_name+'</b><br><small class="top">TOP '+x.top_points+' pts · '+x.top_voters+' votant'+(x.top_voters>1?'s':'')+'</small> · <small class="flop">FLOP '+x.flop_points+' pts · '+x.flop_voters+' votant'+(x.flop_voters>1?'s':'')+'</small></span><span class="pts">'+x.total_points+' pts</span></div>').join('')||'<p>Aucun résultat.</p>'}catch(e){app.textContent=e.message}})()</script></body></html>
